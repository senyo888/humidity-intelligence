name: Release check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "custom_components/humidity_intelligence/**"
      - "hacs.json"
      - "scripts/build_release_zip.py"
      - "tests 2/test_release_zip.py"
      - ".github/workflows/release.yml"
  push:
    branches: [senyo888-patch-1, develop, main]
    paths:
      - "custom_components/humidity_intelligence/**"
      - "hacs.json"
      - "scripts/build_release_zip.py"
      - "tests 2/test_release_zip.py"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f hacs.json
          python - <<'PY'
          import json
          from pathlib import Path

          integration = Path("custom_components/humidity_intelligence")
          manifest = integration / "manifest.json"
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          if "content_in_root" in hacs:
              raise SystemExit("hacs.json must not declare content_in_root")
          if Path("manifest.json").exists():
              raise SystemExit("Root manifest.json is not allowed")
          if not integration.is_dir():
              raise SystemExit(f"Missing integration directory: {integration}")
          integrations = sorted(
              path
              for path in Path("custom_components").iterdir()
              if path.is_dir()
          )
          if integrations != [integration]:
              raise SystemExit(
                  "Expected exactly custom_components/humidity_intelligence"
              )
          if not manifest.is_file():
              raise SystemExit(f"Missing integration manifest: {manifest}")
          for rel_path in ("brand/icon.png", "brand/logo.png"):
              brand_path = integration / rel_path
              if not brand_path.is_file():
                  raise SystemExit(f"Missing local integration brand asset: {brand_path}")
              repository_brand_path = Path("brand") / brand_path.name
              if not repository_brand_path.is_file():
                  raise SystemExit(
                      f"Missing repository brand source: {repository_brand_path}"
                  )
              if repository_brand_path.read_bytes() != brand_path.read_bytes():
                  raise SystemExit(
                      f"Repository and integration brand assets differ: {brand_path.name}"
                  )
          for rel_path in ("icon.png", "logo.png"):
              misplaced_brand_path = integration / rel_path
              if misplaced_brand_path.exists():
                  raise SystemExit(
                      f"Integration brand asset must be under {integration / 'brand'}: "
                      f"{misplaced_brand_path}"
                  )

          data = json.loads(manifest.read_text(encoding="utf-8"))
          if data.get("domain") != "humidity_intelligence":
              raise SystemExit("Integration manifest domain must be humidity_intelligence")
          if not data.get("version"):
              raise SystemExit(f"{manifest} has no version.")
          print(f"{manifest}: {data['version']}")
          PY

      - name: Validate branch/version policy
        run: python scripts/check_version_governance.py

      - name: Test release packaging and failure boundaries
        run: python "tests 2/test_release_zip.py"

      - name: Build and verify exact-commit install asset
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          python scripts/build_release_zip.py --commit "$source_commit" \
            --output "$RUNNER_TEMP/hi-release" > "$RUNNER_TEMP/hi-release-summary.json"
          python scripts/build_release_zip.py --commit "$source_commit" \
            --verify "$RUNNER_TEMP/hi-release/humidity_intelligence.zip"
          python scripts/build_release_zip.py --commit "$source_commit" \
            --output "$RUNNER_TEMP/hi-release-repeat" > "$RUNNER_TEMP/hi-release-repeat.json"
          cmp "$RUNNER_TEMP/hi-release/humidity_intelligence.zip" \
            "$RUNNER_TEMP/hi-release-repeat/humidity_intelligence.zip"
          cmp "$RUNNER_TEMP/hi-release-summary.json" "$RUNNER_TEMP/hi-release-repeat.json"
          cat "$RUNNER_TEMP/hi-release-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain verified candidate for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hi-release-package
          path: |
            ${{ runner.temp }}/hi-release/humidity_intelligence.zip
            ${{ runner.temp }}/hi-release-summary.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false

      - name: Note
        run: echo "This workflow validates release readiness only; it does not publish."
