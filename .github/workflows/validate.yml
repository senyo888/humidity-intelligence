name: Validate

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.29.1"
          GITLEAKS_SHA256="e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Gitleaks full-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --no-banner --config .gitleaks.toml .

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install requirements if present
        shell: bash
        run: |
          set -euo pipefail
          for file in requirements.txt requirements-dev.txt; do
            if [ -f "$file" ]; then
              python -m pip install --upgrade pip
              python -m pip install -r "$file"
            fi
          done

      - name: Check HACS layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          required = {"domain", "documentation", "issue_tracker", "codeowners", "name", "version"}
          integration = Path("custom_components/humidity_intelligence")
          manifest = integration / "manifest.json"

          if "content_in_root" in hacs:
              raise SystemExit("hacs.json must not declare content_in_root")
          if Path("manifest.json").exists():
              raise SystemExit("Root manifest.json is not allowed")
          if not integration.is_dir():
              raise SystemExit(f"Missing integration directory: {integration}")
          integrations = sorted(
              path
              for path in Path("custom_components").iterdir()
              if path.is_dir()
          )
          if integrations != [integration]:
              raise SystemExit(
                  "Expected exactly custom_components/humidity_intelligence"
              )

          if not manifest.is_file():
              raise SystemExit(f"Missing integration manifest: {manifest}")
          for rel_path in ("brand/icon.png", "brand/logo.png"):
              brand_path = integration / rel_path
              if not brand_path.is_file():
                  raise SystemExit(f"Missing local integration brand asset: {brand_path}")
              repository_brand_path = Path("brand") / brand_path.name
              if not repository_brand_path.is_file():
                  raise SystemExit(
                      f"Missing repository brand source: {repository_brand_path}"
                  )
              if repository_brand_path.read_bytes() != brand_path.read_bytes():
                  raise SystemExit(
                      f"Repository and integration brand assets differ: {brand_path.name}"
                  )
          for rel_path in ("icon.png", "logo.png"):
              misplaced_brand_path = integration / rel_path
              if misplaced_brand_path.exists():
                  raise SystemExit(
                      f"Integration brand asset must be under {integration / 'brand'}: "
                      f"{misplaced_brand_path}"
                  )

          data = json.loads(manifest.read_text(encoding="utf-8"))
          if data.get("domain") != "humidity_intelligence":
              raise SystemExit("Integration manifest domain must be humidity_intelligence")
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f"{manifest} is missing required keys: {', '.join(missing)}")

          print(f"HACS layout OK: {manifest}")
          PY

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/humidity_intelligence

      - name: Validate JSON metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("hacs.json"),
              Path("custom_components/humidity_intelligence/manifest.json"),
          ]

          for path in paths:
              if not path.exists():
                  raise SystemExit(f"Missing required file: {path}")
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          PY

      - name: Validate branch/version policy
        run: python scripts/check_version_governance.py

      - name: Validate canonical documentation banners
        run: python "tests 2/test_doc_banners.py"

      - name: Validate workflow configuration
        run: python -m unittest "tests 2/test_workflows.py"

      - name: Validate deterministic controller package
        run: python "tests 2/test_controller_package.py"

      - name: Validate generated-card renderers
        shell: bash
        run: |
          set -euo pipefail
          node --test "tests 2/test_reason_card_renderer.mjs"
          node --test "tests 2/test_stability_badge_renderer.mjs"

      - name: Validate YAML if PyYAML is available
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              print("PyYAML is not installed; skipping YAML validation.")
              raise SystemExit(0)

          for path in sorted(list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.yaml"))):
              if ".git" in path.parts:
                  continue
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid YAML: {path}")
          PY

      - name: Install security scanners
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]==1.9.4" "semgrep==1.166.0"

      - name: Bandit SAST
        shell: bash
        run: |
          set -euo pipefail
          bandit -r . -c pyproject.toml --severity-level medium
          bandit -r . -c pyproject.toml --severity-level low || true

      - name: Semgrep SAST
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan --config=p/python .

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          skip_dirs = {".git", ".pytest_cache", "__pycache__", "assets", "brand"}
          skip_suffixes = {".gif", ".jpg", ".jpeg", ".png", ".pyc"}
          patterns = {
              "AWS access key": re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b"),
              "Google API key": re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b"),
              "GitHub token": re.compile(r"\b(?:ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{82})\b"),
              "Slack token": re.compile(r"\bxox[baprs]-[0-9A-Za-z-]+\b"),
              "OpenAI key": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "Private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA |)?PRIVATE KEY-----"),
              "Assigned secret": re.compile(
                  r"(?i)\b(?:password|api[_-]?key|secret|token)\s*[:=]\s*['\"][^'\"\s]{8,}['\"]"
              ),
          }

          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append(f"{path}:{line_no}: possible {label}")

          if findings:
              print("\n".join(findings))
              raise SystemExit("Potential secrets found.")
          print("No high-confidence secret patterns found.")
          PY
