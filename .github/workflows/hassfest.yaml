name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: Verify tracked Hassfest layout and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("custom_components/humidity_intelligence")
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          if "content_in_root" in hacs:
              raise SystemExit("hacs.json must not declare content_in_root")
          if Path("manifest.json").exists():
              raise SystemExit("Root manifest.json is not allowed")
          if not base.is_dir():
              raise SystemExit(f"Missing integration directory: {base}")
          integrations = sorted(
              path
              for path in Path("custom_components").iterdir()
              if path.is_dir()
          )
          if integrations != [base]:
              raise SystemExit(
                  "Expected exactly custom_components/humidity_intelligence"
              )

          manifest_path = base / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit(f"Missing integration manifest: {manifest_path}")
          for rel_path in ("brand/icon.png", "brand/logo.png"):
              brand_path = base / rel_path
              if not brand_path.is_file():
                  raise SystemExit(f"Missing local integration brand asset: {brand_path}")
              repository_brand_path = Path("brand") / brand_path.name
              if not repository_brand_path.is_file():
                  raise SystemExit(
                      f"Missing repository brand source: {repository_brand_path}"
                  )
              if repository_brand_path.read_bytes() != brand_path.read_bytes():
                  raise SystemExit(
                      f"Repository and integration brand assets differ: {brand_path.name}"
                  )
          for rel_path in ("icon.png", "logo.png"):
              misplaced_brand_path = base / rel_path
              if misplaced_brand_path.exists():
                  raise SystemExit(
                      f"Integration brand asset must be under {base / 'brand'}: "
                      f"{misplaced_brand_path}"
                  )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("domain") != "humidity_intelligence":
              raise SystemExit("Integration manifest domain must be humidity_intelligence")
          keys = list(manifest)
          expected = ["domain", "name"] + sorted(keys[2:])
          if keys != expected:
              raise SystemExit(f"Manifest keys are not sorted for Hassfest: {keys}")

          for rel_path in ("strings.json", "translations/en.json"):
              path = base / rel_path
              text = path.read_text(encoding="utf-8")
              data = json.loads(text)
              if "<layout>" in text:
                  raise SystemExit(f"{rel_path} still contains <layout>")
              for section in ("config", "options"):
                  for step_name, step in data.get(section, {}).get("step", {}).items():
                      if isinstance(step, dict) and "errors" in step:
                          raise SystemExit(f"{rel_path} has nested errors at {section}.{step_name}")
          print("Tracked Hassfest layout and metadata are valid.")
          PY

      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master
