name: Bug report
description: Report something that is not working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, download the Home Assistant diagnostics file for Humidity Intelligence if you can:

        Settings -> Devices & services -> Humidity Intelligence -> Download diagnostics

        Attach the downloaded file below. This is preferred over pasting a dump_diagnostics export unless a maintainer asks for that fuller local JSON.

        Please review the bundle before attaching if you are concerned about privacy. The bundle is designed to redact sensitive values, but you remain in control of what you upload.
  - type: textarea
    id: diagnostics-file
    attributes:
      label: Attach your Humidity Intelligence diagnostics file
      description: Drag the downloaded Home Assistant diagnostics file here, or write "Unable to download diagnostics" and fill in the fallback fields below.
      render: text
  - type: textarea
    id: inspector-handoff
    attributes:
      label: HI Support Bundle Inspector handoff (optional)
      description: Paste only the copied HI-SUPPORT-HANDOFF/1 text if you used the Inspector. This advisory summary is separate from, and does not replace, the preferred native diagnostics attachment. Do not paste the original diagnostics content here.
      render: text
  - type: input
    id: hi-version
    attributes:
      label: Humidity Intelligence version (fallback)
      description: Optional if diagnostics are attached.
      placeholder: "Installed HI version shown after restart"
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version (fallback)
      description: Optional if diagnostics are attached.
      placeholder: "2026.4.3"
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - HACS
        - Manual
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Runtime/control
        - Config flow/options
        - Generated UI/dashboard
        - Services/diagnostics
        - Documentation
        - HACS/install
        - Governance/release
        - Unsure
    validations:
      required: true
  - type: input
    id: browser-app
    attributes:
      label: Browser/app, if relevant
      placeholder: "Chrome, HA iOS app, etc."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behaviour, actual behaviour, and steps to reproduce.
    validations:
      required: true
  - type: checkboxes
    id: triage-signals
    attributes:
      label: Triage signals
      options:
        - label: Safety, CO, or emergency behaviour may be affected.
        - label: This may block a release or HACS install.
        - label: This looks like a regression from a previous HI version.
        - label: This may be a duplicate of another issue.
        - label: I think this needs maintainer/community reply rather than code.
        - label: I think this needs proposal review before implementation.
  - type: dropdown
    id: refresh-ui
    attributes:
      label: Did you run `humidity_intelligence.refresh_ui` after updating?
      options:
        - "Yes"
        - "No"
        - "Not relevant"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: validation-tried
    attributes:
      label: Checks already tried
      description: List any relevant checks, such as downloading diagnostics, refresh_ui, self_check, v205_release_check, dump_diagnostics, or a Home Assistant restart.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs, entities, or screenshots
      description: Paste relevant redacted logs/config and attach screenshots if useful.
      render: text
