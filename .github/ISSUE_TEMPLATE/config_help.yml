name: Configuration help
description: Ask for setup or configuration help.
title: "[Config help]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        If you can, download the Home Assistant diagnostics file for Humidity Intelligence first:

        Settings -> Devices & services -> Humidity Intelligence -> Download diagnostics

        Attach the downloaded file below. This is preferred over pasting a dump_diagnostics export unless a maintainer asks for that fuller local JSON.

        Please review the bundle before attaching if you are concerned about privacy. The bundle is designed to redact sensitive values, but you remain in control of what you upload.
  - type: textarea
    id: diagnostics-file
    attributes:
      label: Attach your Humidity Intelligence diagnostics file
      description: Drag the downloaded Home Assistant diagnostics file here, or write "Unable to download diagnostics" and answer the setup questions below.
      render: text
  - type: textarea
    id: inspector-handoff
    attributes:
      label: HI Support Bundle Inspector handoff (optional)
      description: Paste only the copied HI-SUPPORT-HANDOFF/1 text if you used the Inspector. This advisory summary is separate from, and does not replace, the preferred native diagnostics attachment. Do not paste the original diagnostics content here.
      render: text
  - type: input
    id: hi-version
    attributes:
      label: Humidity Intelligence version (fallback)
      description: Optional if diagnostics are attached.
      placeholder: "Installed HI version shown after restart"
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version (fallback)
      description: Optional if diagnostics are attached.
      placeholder: "2026.4.3"
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Runtime/control
        - Config flow/options
        - Generated UI/dashboard
        - Services/diagnostics
        - Documentation
        - HACS/install
        - Governance/release
        - Unsure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are you trying to configure or achieve?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Current setup
      description: Optional if diagnostics are attached. Otherwise, describe which sensors, outputs, zones, or alert-only settings are configured.
  - type: textarea
    id: stuck
    attributes:
      label: What is unclear or unavailable?
      description: Include redacted YAML/logs if useful.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: triage-signals
    attributes:
      label: Triage signals
      options:
        - label: Safety, CO, or emergency behaviour may be affected.
        - label: This may block a release or HACS install.
        - label: This looks like a regression from a previous HI version.
        - label: This may be a duplicate of another issue.
        - label: I think this needs maintainer/community reply rather than code.
        - label: I think this needs proposal review before implementation.
