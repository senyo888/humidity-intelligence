            const cfg = diagAttrs.config || {};
            const telemetry = Array.isArray(cfg.telemetry) ? cfg.telemetry : [];
            const zones = cfg.zones && typeof cfg.zones === 'object' ? cfg.zones : {};
            const norm = (v) => String(v || '').trim().toLowerCase();
