                    if (isNaN(d)) return '#94a3b8';
                    if (Math.abs(d) >= 6.5) return '#ef4444';
                    if (Math.abs(d) < 0.5) return '#94a3b8';
                    if (d > 0) return '#facc15';
                    return '#7dd3fc';
                  ]]]
            name:
              - font-size: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '12px' : '10px';
                  ]]]
              - font-weight: 900
              - opacity: 0.95
            state:
              - font-size: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '17px' : '13px';
                  ]]]
              - font-weight: 900
              - letter-spacing: 0.2px
              - color: |
                  [[[
                    const d = parseFloat(entity.state);
                    if (isNaN(d)) return '#94a3b8';
                    if (Math.abs(d) >= 6) return '#ef4444';
                    if (Math.abs(d) < 2.0) return '#94a3b8';
                    if (d > 0) return '#facc15';
                    return '#7dd3fc';
                  ]]]
