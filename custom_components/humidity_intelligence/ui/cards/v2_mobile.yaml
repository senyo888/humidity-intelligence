              .flatMap((zone) => zone && zone.enabled !== false && Array.isArray(zone?.rooms) ? zone.rooms : [])
              .map((room) => String(room || '').trim())
              .filter(Boolean))]
              .sort((a, b) => a.localeCompare(b));
            const zoneTelemetry = (sensorType) => zoneRooms
              .map((room) => {
                const match = telemetry.find((item) =>
                  item?.sensor_type === sensorType &&
                  norm(item.room) === norm(room) &&
                  item.entity_id
                );
                return match ? { label: room, entity: match.entity_id } : null;
              })
              .filter(Boolean);

