              const availability = stability.availability
                || entity?.attributes?.stability_score_availability || '';
              const validScore = typeof rawValue === 'number' && Number.isInteger(rawValue)
                && rawValue >= 0 && rawValue <= 100;
              const invalidScore = (rawValue != null && !validScore)
                || (availability === 'available' && !validScore)
