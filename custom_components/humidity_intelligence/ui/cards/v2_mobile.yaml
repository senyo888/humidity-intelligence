# Humidity Intelligence V2 Mobile Manual-card YAML
#
# What this is:
# - A rendered Lovelace card for the V2 mobile dashboard.
# - Paste this whole YAML block into a Home Assistant Dashboard Manual card.
# - Do not paste this into configuration.yaml.
#
# How to use after an upgrade or UI-changing option update:
# 1. Export refreshed Humidity Intelligence card YAML from Home Assistant.
# 2. Open the exact /config/humidity_intelligence/ui/... path from the latest
#    Humidity Intelligence notification; multi-entry/custom exports use other names.
# 3. Replace the old Manual card YAML with the full contents of that file.
# 4. Save the dashboard and hard-refresh the browser/app if the old UI remains cached.
#
# Required custom cards:
# - mod-card
# - card-mod
# - button-card
# - apexcharts-card
#
# The integration replaces placeholder entity IDs when this file is exported.
# Edit entity IDs manually only if you are deliberately overriding the generated mapping.

type: custom:mod-card
card_mod:
  style: |
    ha-card {
      --cv-scale: 1; /* 0.9 / 1 / 1.05 */
      transform: scale(var(--cv-scale));
      transform-origin: top center;

      background: radial-gradient(1200px 600px at 20% 0%, rgba(56,189,248,0.16), transparent 55%),
                  radial-gradient(1000px 600px at 80% 0%, rgba(250,204,21,0.08), transparent 55%),
                  rgba(15,23,42,0.62);
      border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.22);
      box-shadow: 0 0 26px rgba(56,189,248,0.16);
      padding: 11px;
      overflow: hidden;
    }
card:
  type: vertical-stack
  cards:
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          entity: sensor.house_average_humidity
          name: Humidity
          icon: mdi:water-percent
          show_name: true
          show_state: true
          show_label: false
          state_display: |
            [[[
              const h = parseFloat(entity.state);
              if (isNaN(h)) return '—%';
              return `${Math.round(h)}%`;
            ]]]
          tap_action:
            action: more-info
          styles:
            card:
              - width: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '116px' : '80px';
                  ]]]
              - height: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '116px' : '80px';
                  ]]]
              - border-radius: 50%
              - padding: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '9px' : '6px';
                  ]]]
              - margin: 0 2px
              - overflow: hidden
              - background: rgba(10,12,16,0.62)
              - border: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '2px solid rgba(56,189,248,0.75)';
                    if (state === 'in_target') return '2px solid rgba(74,222,128,0.70)';
                    if (state === 'above_target') return '2px solid rgba(250,204,21,0.75)';
                    if (state === 'high_risk') return '2px solid rgba(239,68,68,0.85)';
                    return '2px solid rgba(148,163,184,0.22)';
                  ]]]
              - box-shadow: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '0 0 24px rgba(56,189,248,0.20)';
                    if (state === 'in_target') return '0 0 24px rgba(74,222,128,0.20)';
                    if (state === 'above_target') return '0 0 24px rgba(250,204,21,0.22)';
                    if (state === 'high_risk') return '0 0 24px rgba(239,68,68,0.22)';
                    return '0 0 16px rgba(148,163,184,0.18)';
                  ]]]
            grid:
              - grid-template-areas: "\"i\" \"n\" \"s\""
              - grid-template-columns: 1fr
              - grid-template-rows: 32px min-content min-content
              - row-gap: 2px
              - justify-items: center
              - align-items: center
            icon:
              - width: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '30px' : '22px';
                  ]]]
              - color: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '#38bdf8';
                    if (state === 'in_target') return '#4ade80';
                    if (state === 'above_target') return '#facc15';
                    if (state === 'high_risk') return '#ef4444';
                    return '#94a3b8';
                  ]]]
            name:
              - font-size: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '12px' : '10px';
                  ]]]
              - font-weight: 900
              - opacity: 0.95
            state:
              - font-size: |
                  [[[
                    const w = window.innerWidth || 390;
                    return (w >= 740) ? '17px' : '13px';
                  ]]]
              - font-weight: 900
              - letter-spacing: 0.2px
              - color: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '#38bdf8';
                    if (state === 'in_target') return '#4ade80';
                    if (state === 'above_target') return '#facc15';
                    if (state === 'high_risk') return '#ef4444';
                    return '#94a3b8';
                  ]]]
          card_mod:
            style: >
              ha-card { position: relative; backdrop-filter: blur(10px);
              -webkit-backdrop-filter: blur(10px); } ha-card::before {
                content:""; position:absolute; inset:-45%;
                background: linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.10) 48%, rgba(255,255,255,0) 58%);
                transform: translateX(-30%) translateY(-10%) rotate(8deg);
                animation: cvShimmer 8s ease-in-out infinite;
                pointer-events:none; opacity:0.40;
              } ha-card::after {
                content:""; position:absolute; inset:0; border-radius:50%;
                background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.10), rgba(255,255,255,0) 55%);
                pointer-events:none; opacity:0.40;
              } @keyframes cvShimmer {
                0%{transform:translateX(-38%) translateY(-12%) rotate(8deg);opacity:.22}
                50%{transform:translateX(38%) translateY(10%) rotate(8deg);opacity:.44}
                100%{transform:translateX(-38%) translateY(-12%) rotate(8deg);opacity:.22}
              }
