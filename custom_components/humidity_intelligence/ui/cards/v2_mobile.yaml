              return chip(label, item.value, item.unit, tempColor(tempValueC(entity)));
            };
            const slopeMap = diagAttrs.slope_map || {};
            const slug = (value) => String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            const sourceSet = new Set([...(Array.isArray(slopeCfg.source_entities) ? slopeCfg.source_entities : [])]);
            const provided = Array.isArray(slopeCfg.provided_sensors) ? slopeCfg.provided_sensors : [];
            const slopeEntityFor = (item) => {
              if (!item?.entity_id || !sourceSet.has(item.entity_id)) return null;
              if (slopeMap[item.entity_id]) return slopeMap[item.entity_id];
              const roomKey = slug(item.room || item.friendly_name || item.entity_id);
              const providedMatch = provided.find((entity) => slug(entity).includes(roomKey));
              if (providedMatch) return providedMatch;
              if (slopeCfg.mode === 'hi_calculates' && roomKey) return `sensor.hi_${roomKey}_temperature_slope`;
              return null;
            };
            const roomTemperatureChips = zoneTelemetry('temperature')
              .map((item) => tempChip(item.label, item.entity))
              .join('');
            const slopeChips = telemetry
              .filter((item) => item?.sensor_type === 'temperature' && item.entity_id && item.room)
              .map((item) => ({ label: String(item.room).trim(), entity: slopeEntityFor(item) }))
              .filter((item) => item.label && item.entity)
              .sort((a, b) => a.label.localeCompare(b.label))
              .map((item) => chip(`${item.label} slope`, signed(num(item.entity)), '°C/h', '#94a3b8'))
              .join('');

            return `
              <div class="cv-scroll">
                ${tempChip('House Temp', 'sensor.house_average_temperature')}
                ${tempChip('Upstairs Temp', 'sensor.air_control_upstairs_average_temperature')}
                ${tempChip('Downstairs Temp', 'sensor.air_control_downstairs_average_temperature')}
                ${roomTemperatureChips}
                ${slopeChips}
              </div>`;
          ]]]
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      styles:
        card:
          - position: relative
          - padding: 16px 16px 14px 16px
          - border-radius: 22px
          - background: rgba(2,6,23,0.38)
          - border: |
              [[[
                const mode = String(states['sensor.air_control_mode']?.state || '').trim().toLowerCase();
                const borderKnownModes = new Set([
                  'normal',
                  'co_emergency',
                  'danger',
                  'air_quality',
                  'global_gate',
                  'away',
                  'cooking',
                  'bathroom',
                  'bath',
                  'paused',
                  'manual_override',
                  'disabled',
                  'telemetry_unavailable',
                ]);
                const borderModeKnown =
                  !!mode &&
                  mode !== 'unknown' &&
                  mode !== 'unavailable' &&
                  (borderKnownModes.has(mode) || mode.includes('alert'));
                const anyAlertActive = Object.keys(states).some((id) => {
                  const stateObj = states[id];
                  if (stateObj?.state !== 'on') return false;
                  const attrs = stateObj.attributes || {};
                  if (attrs.alert_index !== undefined && attrs.trigger_type) return true;
                  return /^(?:switch|input_boolean)\\.(?:hi_)?(?:air_)?alert_\\d+.*_active(?:_\\d+)?$/.test(id);
                });
                const zone1 = mode === 'cooking';
                const zone2 = mode === 'bathroom' || mode === 'bath';
                const gateActive = mode === 'global_gate' || mode === 'away';
                const coE = states['input_boolean.air_co_emergency_active']?.state === 'on';
                const red =
                  mode.includes('alert') ||
                  mode === 'co_emergency' ||
                  coE ||
                  (!gateActive && anyAlertActive);
                if (mode === 'telemetry_unavailable') return '1px solid rgba(245,158,11,0.78)';
                if (!borderModeKnown) return '1px solid rgba(148,163,184,0.55)';
                if (red) return '1px solid rgba(239,68,68,0.85)';
                if (gateActive) return '1px solid rgba(245,158,11,0.78)';
                if (zone1) return '1px solid rgba(56,189,248,0.75)';
                if (zone2) return '1px solid rgba(74,222,128,0.70)';

                const aqActive =
                  mode === 'air_quality' ||
                  states['input_boolean.air_aq_upstairs_active']?.state === 'on' ||
                  states['input_boolean.air_aq_downstairs_active']?.state === 'on';

                if (aqActive) return '1px solid rgba(168,85,247,0.70)';
                if (mode === 'normal') return '1px solid rgba(229,231,235,0.68)';
                if (mode === 'paused') return '1px solid rgba(250,204,21,0.70)';
                return '1px solid rgba(148,163,184,0.55)';
              ]]]
