                const rows = [
                  '"i i"',
                  '"n n"',
                  '"s s"',
                  '"l l"',
                  '"status status"',
                  '"reason reason"',
                  '"aq aq"',
                  '"humidity humidity"',
                ];
                if (showTemp) rows.push('"temperature temperature"');
                return rows.join('\n');
              ]]]
