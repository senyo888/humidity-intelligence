    - type: custom:button-card
      entity: sensor.air_control_mode
      name: Current Air Control
      icon: mdi:eye
      show_icon: true
      show_name: true
      show_state: true
      show_label: true
      state_display: |
        [[[
          const rawMode = String(states['sensor.air_control_mode']?.state || '').trim();
          const mode = rawMode.toLowerCase();
          const knownModes = new Set([
            'normal',
            'co_emergency',
            'danger',
            'air_quality',
            'global_gate',
            'away',
            'cooking',
            'bathroom',
            'bath',
            'paused',
            'manual_override',
            'disabled',
            'telemetry_unavailable',
          ]);
          const modeKnown =
            !!mode &&
            mode !== 'unknown' &&
            mode !== 'unavailable' &&
            (knownModes.has(mode) || mode.includes('alert'));
          if (!modeKnown) return 'UNKNOWN';
          const display = states['sensor.air_control_mode']?.attributes?.display;
          if (display && String(display).trim()) return String(display);
          return rawMode.replace(/_/g,' ').toUpperCase();
        ]]]
      label: |
        [[[
          const low  = parseFloat(states['sensor.house_humidity_target_low']?.state);
          const high = parseFloat(states['sensor.house_humidity_target_high']?.state);
          const h    = parseFloat(states['sensor.house_average_humidity']?.state);
          const season = String(states['sensor.house_humidity_target_season']?.state || 'Seasonal').trim() || 'Seasonal';

          const bandTxt = (isNaN(low) || isNaN(high))
            ? `Target humidity (${season}): —`
            : `Target humidity (${season}): ${low.toFixed(0)}–${high.toFixed(0)}%`;

          let comfort = 'Comfort: —';
          if (!isNaN(h) && !isNaN(low) && !isNaN(high)) {
            if (h < low) comfort = 'Comfort: A bit dry — humidify / reduce extraction.';
            else if (h <= high) comfort = 'Comfort: In the sweet spot — keep steady.';
            else comfort = 'Comfort: High humidity — ventilate 30 to 45 min.';
          }

          return `${bandTxt}\n${comfort}`;
        ]]]
      custom_fields:
        status: |
          [[[
            const rawMode = String(states['sensor.air_control_mode']?.state || '').trim().toLowerCase();
            const knownModes = new Set([
              'normal',
              'co_emergency',
              'danger',
              'air_quality',
              'global_gate',
              'away',
              'cooking',
              'bathroom',
              'bath',
              'paused',
              'manual_override',
              'disabled',
              'telemetry_unavailable',
            ]);
            const modeKnown =
              !!rawMode &&
              rawMode !== 'unknown' &&
              rawMode !== 'unavailable' &&
              (knownModes.has(rawMode) || rawMode.includes('alert'));
            const mode = modeKnown ? rawMode : 'unknown';

            const coE  = states['input_boolean.air_co_emergency_active']?.state === 'on';
            const aqU  = states['input_boolean.air_aq_upstairs_active']?.state === 'on';
            const aqD  = states['input_boolean.air_aq_downstairs_active']?.state === 'on';
            const dHumHelper = states['input_boolean.air_downstairs_humidifier_active']?.state === 'on';
            const uHumHelper = states['input_boolean.air_upstairs_humidifier_active']?.state === 'on';
            const humidifierTruth =
              states['sensor.air_control_reason']?.attributes?.humidifier_status || {};
            const humidifierLanes =
              humidifierTruth && typeof humidifierTruth.lanes === 'object'
                ? humidifierTruth.lanes
                : {};
            const humidifierLane = (level, helperRequested) => {
              const row = humidifierLanes[level];
              if (row && typeof row === 'object') return row;
              return {
                demand: helperRequested ? 'requested' : 'inactive',
                reconciliation: helperRequested ? 'requested' : 'inactive',
              };
            };
            const dHum = humidifierLane('level1', dHumHelper);
            const uHum = humidifierLane('level2', uHumHelper);
            const fanIso = states['input_boolean.air_isolate_fan_outputs']?.state === 'on';
            const humIso = states['input_boolean.air_isolate_humidifier_outputs']?.state === 'on';
            const isAlertActiveEntity = (id) => {
              const stateObj = states[id];
              if (stateObj?.state !== 'on') return false;
              const attrs = stateObj.attributes || {};
              if (attrs.alert_index !== undefined && attrs.trigger_type) return true;
              return /^(?:switch|input_boolean)\\.(?:hi_)?(?:air_)?alert_\\d+.*_active(?:_\\d+)?$/.test(id);
            };
            const activeAlertIds = Object.keys(states).filter(isAlertActiveEntity);
            const activeAlertNames = activeAlertIds.map(
              (id) => states[id]?.attributes?.friendly_name || id
            );
            const zone1 = mode === 'cooking';
            const zone2 = (mode === 'bathroom' || mode === 'bath');
            const aqActive = mode === 'air_quality' || aqU || aqD;
            const gateActive = mode === 'global_gate' || mode === 'away';
            const alertLaneActive =
              mode.includes('alert') ||
              mode === 'co_emergency' ||
              coE ||
              (!gateActive && activeAlertIds.length > 0);
            const red = alertLaneActive;
            const gateReason = String(states['sensor.air_control_reason']?.state || '').toLowerCase();
            const timeGateActive = gateActive && gateReason.includes('time gate');
            const presenceGateActive = gateActive && gateReason.includes('presence gate');
            const ready = modeKnown && mode === 'normal' && !red && !zone1 && !zone2 && !aqActive && !gateActive;

            const escapeHtml = (value) => String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
            const chip = (t, c, glow=false) =>
              `<span class="cv-chip ${glow ? 'glow' : ''}" style="--cv:${c}; border-color: color-mix(in srgb, var(--cv) 55%, rgba(148,163,184,0.18));">
                <span class="t">${escapeHtml(t)}</span>
              </span>`;
            const humidifierChip = (label, row) => {
              const status = String(row?.reconciliation || 'unknown');
              const requested = row?.demand === 'requested';
              const visibleWithoutDemand = new Set(['stopping', 'fault_latched', 'degraded', 'unknown']);
              if (!requested && !visibleWithoutDemand.has(status)) return '';
              const labels = {
                output_on: 'On',
                platform_idle: 'Idle',
                requested: 'Requested',
                retrying: 'Retrying',
                stopping: 'Stopping',
                isolated: 'Isolated',
                fault_latched: 'Fault',
                degraded: 'Degraded',
                unknown: 'Unknown',
              };
              const colors = {
                output_on: '#22d3ee',
                platform_idle: '#f59e0b',
                requested: '#22d3ee',
                retrying: '#f59e0b',
                stopping: '#f59e0b',
                isolated: '#f59e0b',
                fault_latched: '#ef4444',
                degraded: '#ef4444',
                unknown: '#94a3b8',
              };
              const text = labels[status] || (requested ? 'Requested' : 'Unknown');
              const color = colors[status] || '#94a3b8';
              return chip(
                `${label} Humidifier · ${text}`,
                color,
                ['retrying', 'fault_latched', 'degraded'].includes(status)
              );
            };

            const cMode = (() => {
              if (mode === 'telemetry_unavailable') return '#f59e0b';
              if (!modeKnown) return '#94a3b8';
              if (red || coE || mode === 'co_emergency' || mode.includes('alert') || mode === 'danger') return '#ef4444';
              if (gateActive) return '#f59e0b';
              if (zone1) return '#38bdf8';
              if (zone2) return '#4ade80';
              if (aqActive) return '#a855f7';
              if (ready) return '#e5e7eb';
              if (mode === 'paused') return '#facc15';
              if (mode === 'manual_override') return '#a855f7';
              if (mode === 'disabled') return '#94a3b8';
              return '#94a3b8';
            })();
            const modeBadgeLabel = (() => {
              if (mode === 'telemetry_unavailable') return 'TELEMETRY UNAVAILABLE';
              if (!modeKnown) return 'UNKNOWN';
              if (red) return 'ALERT';
              if (gateActive) return 'GATE';
              if (zone1) return 'ZONE 1';
              if (zone2) return 'ZONE 2';
              if (aqActive) return 'AQ';
              if (ready) return 'READY';
              return mode.replace(/_/g,' ').toUpperCase();
            })();

            const out = [];
            const CHIPSET_SCROLL_RESET_DELAY_MS = 15000;
            out.push(chip(modeBadgeLabel, cMode, true));
            if (aqD) out.push(chip('AQ Downstairs', '#a855f7'));
            if (aqU) out.push(chip('AQ Upstairs', '#a855f7'));
            if (coE) out.push(chip('CO EMERGENCY', '#ef4444', true));
            const alertContextId =
              Object.keys(states).find((id) => id === 'sensor.active_alert_context') ||
              Object.keys(states).find((id) => /^sensor\\..*active_alert_context$/.test(id));
            const alertContext = String(states[alertContextId]?.state || '').trim();
            if (alertLaneActive && alertContext && alertContext !== 'None' && alertContext !== 'unknown' && alertContext !== 'unavailable') {
              const alertChipText = alertContext.startsWith('Humidity Danger · ')
                ? (alertContext.replace(/\s*·\s*[^·]*\s>=\s.*$/, '').trim() || alertContext)
                : alertContext;
              out.push(chip(alertChipText, '#ef4444', true));
            }
            if (timeGateActive) out.push(chip('Time Gate', '#f59e0b'));
            if (presenceGateActive) out.push(chip('Presence Gate', '#f59e0b'));
            const humidifierOut = [];
            const dHumChip = humidifierChip('Downstairs', dHum);
            const uHumChip = humidifierChip('Upstairs', uHum);
            if (dHumChip) humidifierOut.push(dHumChip);
            if (uHumChip) humidifierOut.push(uHumChip);
            if (fanIso) out.push(chip('FAN OUTPUTS ISOLATED', '#f59e0b', true));
            if (humIso) humidifierOut.push(chip('HUMIDIFIER OUTPUTS ISOLATED', '#f59e0b', true));

            const scrollRow = (chips, label) =>
              `<div class="cv-scroll" role="group" aria-label="${label}" data-scroll-reset-delay-ms="${CHIPSET_SCROLL_RESET_DELAY_MS}">${chips.join('')}</div>`;
            out.push(...humidifierOut);
            return scrollRow(out, 'Current Air Control status');
          ]]]
        reason: |
          [[[
            const escapeHtml = (value) => String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
            const wrapReason = (content) =>
              '<div class="cv-reason" role="region" aria-label="Current Air Control reason" tabindex="0">' +
              content +
              '</div>';
            const reasonState = states['sensor.air_control_reason'];
            const legacyReason = () => {
              try {
                const fullReason = String(reasonState?.attributes?.full_reason || '').trim();
                if (fullReason) return fullReason;
              } catch (e) {
                // Continue to the bounded state fallback.
              }
              try {
                const stateReason = String(reasonState?.state || '').trim();
                if (stateReason && !['unknown', 'unavailable'].includes(stateReason.toLowerCase())) {
                  return stateReason;
                }
              } catch (e) {
                // Continue to the fixed final fallback.
              }
              return 'Reason unavailable.';
            };
            try {
              const displayReason = reasonState?.attributes?.display_reason;
              const isPlainObject = (value) =>
                value !== null && typeof value === 'object' && !Array.isArray(value);
              const hasOwn = (value, key) =>
                Object.prototype.hasOwnProperty.call(value, key);
              const hasExactKeys = (value, required, optional = []) => {
                if (!isPlainObject(value)) return false;
                const keys = Object.keys(value);
                const allowed = new Set([...required, ...optional]);
                return required.every((key) => hasOwn(value, key)) &&
                  keys.every((key) => allowed.has(key)) &&
                  keys.length >= required.length &&
                  keys.length <= required.length + optional.length;
              };
              const codePointLength = (value) => Array.from(value).length;
              const containsRawEntityId = (value) => {
                const withoutBenignDots = value.replace(
                  /\b(?:PM2\.5|v\d+(?:\.\d+){1,2})\b/giu,
                  ''
                );
                return /(^|[^a-z0-9_])(?:[a-z_][a-z0-9_]*)\.[a-z0-9_]+(?![a-z0-9_])/u.test(
                  withoutBenignDots
                );
              };
              const validText = (value, maximum) =>
                typeof value === 'string' &&
                value.length > 0 &&
                codePointLength(value) <= maximum &&
                value === value.trim().replace(/\s+/gu, ' ') &&
                !/\p{C}/u.test(value) &&
                !/[<>]/u.test(value) &&
                !value.includes(String.fromCharCode(96)) &&
                !containsRawEntityId(value);
              const validToken = (value) =>
                typeof value === 'string' &&
                codePointLength(value) <= 64 &&
                /^[a-z][a-z0-9_]{0,63}$/u.test(value);
              const validCode = (value) =>
                typeof value === 'string' &&
                codePointLength(value) <= 96 &&
                /^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$/u.test(value);
              const validArgs = (value) => {
                if (!isPlainObject(value)) return false;
                const keys = Object.keys(value);
                if (keys.length > 6 || !keys.every(validToken)) return false;
                return keys.every((key) => {
                  const item = value[key];
                  if (item === null || typeof item === 'boolean') return true;
                  if (typeof item === 'number') return Number.isFinite(item);
                  return typeof item === 'string' && validText(item, 64);
                });
              };
              const validLine = (line) => {
                if (!hasExactKeys(
                  line,
                  ['role', 'scope', 'code', 'truth', 'text'],
                  ['args']
                )) return false;
                if (!new Set(['why', 'action', 'next', 'notice']).has(line.role)) return false;
                if (!new Set(['system', 'safety', 'ventilation', 'humidifier']).has(line.scope)) return false;
                if (!new Set([
                  'selected',
                  'blocked',
                  'requested',
                  'observed',
                  'unavailable',
                  'unmapped',
                  'not_confirmed',
                  'failed',
                ]).has(line.truth)) return false;
                if (!validCode(line.code) || !validText(line.text, 200)) return false;
                return !hasOwn(line, 'args') || validArgs(line.args);
              };
              const validDisplayReason = (() => {
                if (!hasExactKeys(displayReason, [
                  'schema',
                  'locale',
                  'family',
                  'variant',
                  'attention',
                  'truncated',
                  'headline',
                  'lines',
                ])) return false;
                if (displayReason.schema !== 'hi.reason.v1' || displayReason.locale !== 'en') return false;
                if (!validToken(displayReason.family) || !validToken(displayReason.variant)) return false;
                if (!new Set([
                  'neutral',
                  'active',
                  'hold',
                  'degraded',
                  'critical',
                  'unknown',
                ]).has(displayReason.attention)) return false;
                if (typeof displayReason.truncated !== 'boolean') return false;
                if (!validText(displayReason.headline, 120)) return false;
                if (!Array.isArray(displayReason.lines) ||
                    displayReason.lines.length < 1 ||
                    displayReason.lines.length > 8 ||
                    !displayReason.lines.every(validLine)) return false;
                try {
                  return new TextEncoder().encode(JSON.stringify(displayReason)).length <= 4096;
                } catch (e) {
                  return false;
                }
              })();

              if (!validDisplayReason) {
                return wrapReason(escapeHtml(legacyReason()));
              }
              const rendered = [
                '<span class="cv-reason__headline">' +
                  escapeHtml(displayReason.headline) +
                  '</span>',
                ...displayReason.lines.map((line) => escapeHtml(line.text)),
              ];
              return wrapReason(rendered.join('<br>'));
            } catch (e) {
              return wrapReason(escapeHtml(legacyReason()));
            }
          ]]]
        aq: |
          [[[
            const num = (id) => {
              const v = parseFloat(states[id]?.state);
              return isNaN(v) ? null : v;
            };

            // IAQ trigger is <=60; UI colours: <=50 bad (red), 51-60 warn (amber)
            const cIAQ = (v) => {
              if (v === null) return '#94a3b8';
              if (v <= 50) return '#ef4444';
              if (v <= 60) return '#facc15';
              return '#4ade80';
            };
            // PM2.5 >=65 bad (red), >=35 warn (amber)
            const cPM = (v) => {
              if (v === null) return '#94a3b8';
              if (v >= 65) return '#ef4444';
              if (v >= 35) return '#facc15';
              return '#4ade80';
            };
            // VOC >=60 bad (red), >=40 warn (amber)
            const cVOC = (v) => {
              if (v === null) return '#94a3b8';
              if (v >= 60) return '#ef4444';
              if (v >= 40) return '#facc15';
              return '#4ade80';
            };
            // CO >=15 bad (red), >=10 warn (amber)
            const cCO = (v) => {
              if (v === null) return '#94a3b8';
              if (v >= 15) return '#ef4444';
              if (v >= 10) return '#facc15';
              return '#4ade80';
            };

            const escapeHtml = (value) => String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
            const chip = (k, v, unit, c) => `
              <span class="cv-chip" style="--cv:${c};">
                <span class="k">${escapeHtml(k)}</span>
                <span class="v" style="color:${c};">${escapeHtml(v === null ? '—' : `${v}${unit || ''}`)}</span>
              </span>`;
            const maybeChip = (k, v, unit, c) => (v === null ? '' : chip(k, v, unit, c));

            const iaqU = num('sensor.air_control_upstairs_iaq_average');
            const pmU  = num('sensor.air_control_upstairs_pm25_average');
            const vocU = num('sensor.air_control_upstairs_voc_average');
            const coU  = num('sensor.air_control_upstairs_co_average');

            const iaqD = num('sensor.air_control_downstairs_iaq_average');
            const pmD  = num('sensor.air_control_downstairs_pm25_average');
            const vocD = num('sensor.air_control_downstairs_voc_average');
            const coD  = num('sensor.air_control_downstairs_co_average');
            const iaqH = num('sensor.air_control_house_iaq_average');
            const pmH  = num('sensor.air_control_house_pm25_average');
            const vocH = num('sensor.air_control_house_voc_average');
            const coH  = num('sensor.air_control_house_co_average');

            return `
              <div class="cv-scroll">
                ${maybeChip('House IAQ', iaqH, '', cIAQ(iaqH))}
                ${maybeChip('House PM2.5', pmH, '', cPM(pmH))}
                ${maybeChip('House VOC', vocH, '', cVOC(vocH))}
                ${maybeChip('House CO', coH, '', cCO(coH))}
                ${maybeChip('Upstairs IAQ', iaqU, '', cIAQ(iaqU))}
                ${maybeChip('Upstairs PM2.5', pmU, '', cPM(pmU))}
                ${maybeChip('Upstairs VOC', vocU, '', cVOC(vocU))}
                ${maybeChip('Upstairs CO', coU, '', cCO(coU))}
                ${maybeChip('Downs.. IAQ', iaqD, '', cIAQ(iaqD))}
                ${maybeChip('Downs.. PM2.5', pmD, '', cPM(pmD))}
                ${maybeChip('Downs.. VOC', vocD, '', cVOC(vocD))}
                ${maybeChip('Downs.. CO', coD, '', cCO(coD))}
              </div>`;
