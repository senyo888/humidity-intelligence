      # --- Drift badge ------------------------------------------------------
      - type: custom:button-card
        entity: sensor.house_humidity_drift_7d
        name: Drift
        icon: mdi:chart-line-variant
        show_name: true
        show_state: true
        show_label: false
        variables:
          hi_drift: |
            [[[
              const attrs = entity?.attributes || {};
              const finite = (value) => typeof value === 'number' && Number.isFinite(value);
              const raw = entity?.state;
              const numeric = typeof raw === 'string' && raw.trim() !== '' && Number.isFinite(Number(raw));
              const blockers = attrs.blocking_reasons;
              const historyReason = 'statistics_dependency_history_not_ready';
              const sourceInvalid = attrs.source_value_valid !== undefined && attrs.source_value_valid !== true;
              const blocked = attrs.status === 'unavailable' || !!attrs.reason
                || (Array.isArray(blockers) ? blockers.length > 0 : blockers !== undefined)
                || sourceInvalid;
              if (numeric && !blocked) {
                const drift = Number(raw);
                return { kind: 'ready', text: `${drift > 0 ? '+' : ''}${drift.toFixed(1)}%`,
                  detail: `Current drift: ${drift > 0 ? '+' : ''}${drift.toFixed(1)} percentage points.` };
              }
              const historyOnly = !numeric && attrs.reason === historyReason
                && attrs.dependency_status === 'history_not_ready'
                && Array.isArray(blockers) && blockers.length === 1 && blockers[0] === historyReason
                && finite(attrs.current_house_humidity) && !sourceInvalid;
              const coverage = attrs.age_coverage_ratio;
              const required = attrs.required_age_coverage_ratio;
              const missingRatio = coverage === undefined || required === undefined;
              const ratiosValid = finite(coverage) && coverage >= 0
                && finite(required) && required > 0 && required <= 1 && coverage < required;
              if (historyOnly && ratiosValid) {
                const progress = Math.min(99, Math.floor(coverage / required * 100));
                return { kind: 'baseline', progress, text: `Baseline · ${progress}%`,
                  detail: `Baseline progress: ${progress}%. History covers ${(coverage * 100).toFixed(1)}% of the seven-day window; ${(required * 100).toFixed(1)}% is required.` };
              }
              if (historyOnly && missingRatio
                  && (coverage === undefined || (finite(coverage) && coverage >= 0 && coverage <= 1))
                  && (required === undefined || (finite(required) && required > 0 && required <= 1))) {
                return { kind: 'waiting', text: 'Waiting for history', detail: 'HI is waiting for enough Statistics history. Baseline progress is unavailable.' };
              }
              if (!numeric && attrs.dependency_status === 'missing' && attrs.reason === 'statistics_dependency_missing'
                  && Array.isArray(blockers) && blockers.length === 1 && blockers[0] === attrs.reason) {
                return { kind: 'setup', text: 'Setup needed', detail: typeof attrs.repair_summary === 'string' ? attrs.repair_summary : 'The seven-day Statistics helper is missing.' };
              }
              const reasons = {
                current_house_humidity_unavailable: 'Current house humidity is unavailable.',
                statistics_dependency_source_not_valid: 'The Statistics helper reports an invalid humidity source.',
                statistics_dependency_unknown: 'The Statistics helper has no usable value yet.',
                statistics_dependency_unavailable: 'The Statistics helper is unavailable.',
                statistics_dependency_non_numeric: 'The Statistics helper is not reporting a numeric mean.'
              };
              return { kind: 'unavailable', text: 'Unavailable', detail: reasons[attrs.reason] || 'Drift is unavailable. Baseline progress cannot be confirmed.' };
            ]]]
        state_display: |
          [[[
            const view = variables.hi_drift;
            if (view.kind === 'ready') return view.text;
            if (view.kind === 'baseline') return `<span style="font-size:10px;line-height:12px;display:block;color:#38bdf8">Baseline<span style="font-size:13px;line-height:16px;display:block">${view.progress}%</span></span>`;
            if (view.kind === 'setup') return '<span style="font-size:9px;line-height:12px;display:block">Setup<br>needed</span>';
            if (view.kind === 'waiting') return '<span style="font-size:9px;line-height:1.1;display:block">Waiting for<br>history</span>';
            return `<span style="font-size:9px">${view.text}</span>`;
          ]]]
        custom_fields:
          open: |
            [[[
              const escapeHtml = (value) => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
              return `<button type="button" class="hi-drift-open" aria-label="Seven-day humidity drift: ${escapeHtml(variables.hi_drift.text)}. Open details" title="${escapeHtml(variables.hi_drift.detail)}"></button>`;
            ]]]
          details: |
            [[[
              const view = variables.hi_drift;
              const escapeHtml = (value) => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
              return `<template class="hi-drift-details-template">
              <style>dialog.hi-drift-details { box-sizing:border-box; width:min(520px,calc(100vw - 32px)); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow:auto; padding:20px; border:1px solid #354762; border-radius:20px; background:#0d1522; color:#e2e8f0; text-align:left; white-space:normal; font:14px/1.6 system-ui,sans-serif; }
              dialog.hi-drift-details::backdrop { background:rgba(0,0,0,.55); }
              dialog.hi-drift-details h2 { margin:0 0 16px; font-size:20px; }
              dialog.hi-drift-details p { overflow-wrap:anywhere; }
              dialog.hi-drift-details button { min-height:44px; padding:10px 16px; border:1px solid #64748b; border-radius:10px; background:#1e293b; color:#f1f5f9; font:inherit; cursor:pointer; }
              dialog.hi-drift-details .hi-drift-close { display:block; position:sticky; top:0; margin:0 0 12px auto; z-index:1; }
              dialog.hi-drift-details button:focus-visible { outline:2px solid #38bdf8; outline-offset:2px; }
              dialog.hi-drift-details progress { width:100%; accent-color:#38bdf8; }</style>
              <button type="button" class="hi-drift-close" autofocus>Close</button>
              <h2>Seven-day humidity drift</h2>
              <p>Compares the current house average humidity with its seven-day mean. Positive values mean wetter than that average; negative values mean drier. The difference is measured in percentage points.</p>
              <p>${escapeHtml(view.detail)}</p>
              ${view.kind === 'baseline' ? `<progress max="100" value="${view.progress}" aria-label="Baseline progress: ${view.progress}%"></progress>` : ''}
              ${view.kind === 'baseline' || view.kind === 'waiting' ? '<p>HI is waiting for enough Statistics history. Baseline progress measures Statistics time coverage toward the required history. Gaps or limited retained history can delay readiness.</p>' : ''}
              <p>View history opens the recorded drift values. Available history depends on Recorder and retention; it is separate from the Statistics helper’s baseline.</p>
              <button type="button" class="hi-drift-history">View history</button>
              </template>`;
            ]]]
        tap_action:
          action: javascript
          javascript: |
            [[[
              const owner = this;
              const entityId = entity?.entity_id;
              const history = () => {
                if (entityId && owner.isConnected) owner.dispatchEvent(new CustomEvent('hass-more-info', {
                  detail: { entityId }, bubbles: true, composed: true
                }));
              };
              const source = owner.shadowRoot?.querySelector('template.hi-drift-details-template');
              if (!source || !owner.isConnected) { history(); return; }
              const existing = document.querySelector('dialog[data-hi-drift-dialog]');
              existing?.__hiDriftDispose?.(false);
              const dialog = document.createElement('dialog');
              if (typeof dialog.showModal !== 'function') { history(); return; }
              const snapshot = source.innerHTML;
              dialog.className = 'hi-drift-details';
              dialog.setAttribute('data-hi-drift-dialog', '');
              dialog.setAttribute('aria-label', 'Seven-day humidity drift details');
              dialog.innerHTML = snapshot;
              const previousFocus = owner.shadowRoot?.activeElement || document.activeElement;
              let observer;
              let cleaned = false;
              let restoreFocus = true;
              const cleanup = () => {
                if (cleaned) return;
                cleaned = true;
                observer?.disconnect();
                for (const name of ['location-changed', 'popstate', 'pagehide']) window.removeEventListener(name, close);
                dialog.remove();
                if (restoreFocus && owner.isConnected && previousFocus?.isConnected) previousFocus.focus();
              };
              const close = () => {
                if (dialog.open) dialog.close();
                cleanup();
              };
              dialog.__hiDriftDispose = (restore = true) => { restoreFocus = restore; close(); };
              dialog.addEventListener('close', cleanup, { once: true });
              dialog.querySelector('.hi-drift-close').addEventListener('click', close);
              const historyButton = dialog.querySelector('.hi-drift-history');
              historyButton.disabled = !entityId;
              historyButton.addEventListener('click', () => { close(); history(); });
              dialog.addEventListener('click', (event) => {
                event.stopPropagation();
                if (event.target !== dialog) return;
                const bounds = dialog.getBoundingClientRect();
                if (event.clientX < bounds.left || event.clientX > bounds.right
                  || event.clientY < bounds.top || event.clientY > bounds.bottom) close();
              });
              for (const name of ['location-changed', 'popstate', 'pagehide']) window.addEventListener(name, close);
              observer = new MutationObserver(() => {
                const current = owner.shadowRoot?.querySelector('template.hi-drift-details-template');
                if (!owner.isConnected || !current || current.innerHTML !== snapshot) close();
              });
              let root = owner.shadowRoot;
              while (root) {
                observer.observe(root, { childList: true, subtree: true, characterData: true });
                root = root.host ? root.host.getRootNode() : null;
              }
              document.body.appendChild(dialog);
              try { dialog.showModal(); }
              catch (_) { cleanup(); history(); }
            ]]]
        hold_action:
          action: more-info
        extra_styles: |
          .hi-drift-open { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; border-radius:inherit; background:transparent; cursor:pointer; }
          .hi-drift-open:focus-visible { outline:2px solid #38bdf8; outline-offset:-4px; }
        styles:
          custom_fields:
            open:
              - position: absolute
              - inset: 0
              - border-radius: inherit
              - z-index: 2
            details:
              - display: none
          card:
            - width: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '122px' : '88px';
                ]]]
            - height: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '122px' : '88px';
                ]]]
            - border-radius: 50%
            - padding: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '10px' : '7px';
                ]]]
            - overflow: hidden
            - background: rgba(10,12,16,0.62)
            - border: |
                [[[
                  const d = variables.hi_drift.kind === 'ready' ? Number(entity.state) : NaN;
                  if (isNaN(d)) return '2px solid rgba(148,163,184,0.22)';
                  if (Math.abs(d) >= 5.0) return '2px solid rgba(239,68,68,0.85)';
                  if (Math.abs(d) < 0.6) return '2px solid rgba(148,163,184,0.35)';
                  if (d > 0) return '2px solid rgba(250,204,21,0.75)';
                  return '2px solid rgba(125,211,252,0.75)';
                ]]]
            - box-shadow: |
                [[[
                  const d = variables.hi_drift.kind === 'ready' ? Number(entity.state) : NaN;
                  if (isNaN(d)) return '0 0 16px rgba(148,163,184,0.18)';
                  if (Math.abs(d) >= 5.0) return '0 0 22px rgba(239,68,68,0.40)';
                  if (Math.abs(d) < 0.6) return '0 0 18px rgba(148,163,184,0.20)';
                  if (d > 0) return '0 0 20px rgba(250,204,21,0.28)';
                  return '0 0 20px rgba(125,211,252,0.25)';
                ]]]
          grid:
            - grid-template-areas: "\"i\" \"n\" \"s\""
            - grid-template-columns: 1fr
            - grid-template-rows: |
                [[[ return variables.hi_drift.kind === 'ready' ? '34px min-content min-content' : '24px min-content min-content'; ]]]
            - row-gap: 2px
            - justify-items: center
            - align-items: center
          icon:
            - width: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '32px' : '24px';
                ]]]
            - color: |
                [[[
                  const d = variables.hi_drift.kind === 'ready' ? Number(entity.state) : NaN;
                  if (isNaN(d)) return '#94a3b8';
                  if (Math.abs(d) >= 5.0) return '#ef4444';
                  if (Math.abs(d) < 0.6) return '#94a3b8';
                  if (d > 0) return '#facc15';
                  return '#7dd3fc';
                ]]]
          name:
            - font-size: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '12px' : '10px';
                ]]]
            - font-weight: 900
            - opacity: 0.95
          state:
            - font-size: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '18px' : '14px';
                ]]]
            - font-weight: 900
            - color: |
                [[[
                  const d = variables.hi_drift.kind === 'ready' ? Number(entity.state) : NaN;
                  if (isNaN(d)) return '#94a3b8';
                  if (Math.abs(d) >= 5.0) return '#ef4444';
                  if (Math.abs(d) < 0.6) return '#94a3b8';
                  if (d > 0) return '#facc15';
                  return '#7dd3fc';
                ]]]
        card_mod:
          style: >
            ha-card { position: relative; backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); }

            ha-card::before {
              content:""; position:absolute; inset:-45%;
              background: linear-gradient(120deg, rgba(255,255,255,0) 45%, rgba(255,255,255,0.10) 49%, rgba(255,255,255,0) 58%);
              transform: translateX(-30%) translateY(-10%) rotate(8deg);
              animation: cvShimmer 8s ease-in-out infinite;
              pointer-events:none; opacity:0.45;
            }

            ha-card::after {
              content:""; position:absolute; inset:0; border-radius:50%;
              background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.10), rgba(255,255,255,0) 55%);
              pointer-events:none; opacity:0.45;
            }

            @keyframes cvShimmer {
              0%{transform:translateX(-38%) translateY(-12%) rotate(8deg);opacity:.25}
              50%{transform:translateX(38%) translateY(10%) rotate(8deg);opacity:.50}
              100%{transform:translateX(-38%) translateY(-12%) rotate(8deg);opacity:.25}
            }

  ###########################################################################
  # Room humidity deltas (top 5)
  ###########################################################################
  ###########################################################################
  # Comfort Band – with floating chevron controlling humidity_constellation
  ###########################################################################
  - type: custom:button-card
    entity: input_boolean.humidity_constellation_expanded
    name: Comfort Band
    icon: mdi:shield-check-outline
    show_icon: true
    show_state: false
    show_label: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info

    custom_fields:
      chevron: |
        [[[
          const expanded =
            states['input_boolean.humidity_constellation_expanded']?.state === 'on';
          const icon = expanded ? 'mdi:chevron-up' : 'mdi:chevron-down';
          return `<ha-icon icon="${icon}"></ha-icon>`;
        ]]]
      deltas: |
        [[[
          const escapeHtml = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
          const items = Object.keys(states)
            .filter((id) =>
              id.startsWith('sensor.hi_') &&
              id.includes('_humidity_delta') &&
              !id.includes('air_control_') &&
              states[id]?.attributes?.room
            )
            .map((id) => {
              const v = parseFloat(states[id]?.state);
              if (isNaN(v)) return null;
              const raw = states[id]?.attributes?.room || states[id]?.attributes?.friendly_name || id;
              const label = String(raw).replace(/HI\\s+/i, '').replace(/Humidity Delta/i, '').trim();
              return { label, value: v };
            })
            .filter(Boolean)
            .sort((a, b) => a.label.localeCompare(b.label));

          if (!items.length) {
            return `<div class="hi-empty">No room delta sensors yet.</div>`;
          }

          const chip = (item) => `
            <div class="hi-delta">
              <span class="k">${escapeHtml(item.label)}</span>
              <span class="v">${item.value > 0 ? '+' : ''}${item.value.toFixed(1)}%</span>
            </div>`;

          return `
            <style>
              .hi-deltas { display:flex; flex-wrap:nowrap; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
              .hi-delta { background: rgba(2,6,23,0.45); border:1px solid rgba(148,163,184,0.3); border-radius: 999px; padding: 6px 10px; font-size: 12px; color:#e5e7eb; display:flex; gap:6px; align-items:center; }
              .hi-delta .k { opacity:0.85; }
              .hi-delta .v { font-weight:600; }
              .hi-empty { color:#94a3b8; font-size: 12px; }
              .hi-deltas::-webkit-scrollbar{ height: 2px; }
              .hi-deltas::-webkit-scrollbar-track{ background: rgba(148,163,184,0.08); border-radius: 999px; }
              .hi-deltas::-webkit-scrollbar-thumb{ background: rgba(148,163,184,0.28); border-radius: 999px; }
            </style>
            <div class="hi-deltas">
              ${items.map(chip).join('')}
            </div>`;
        ]]]

    label: |
      [[[
        const escapeHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
        const lowEnt   = states['sensor.house_humidity_target_low'];
        const highEnt  = states['sensor.house_humidity_target_high'];
        const hEnt     = states['sensor.house_average_humidity'];
        const season   = String(states['sensor.house_humidity_target_season']?.state || 'Seasonal').trim() || 'Seasonal';

        const low  = lowEnt  ? parseFloat(lowEnt.state)  : NaN;
        const high = highEnt ? parseFloat(highEnt.state) : NaN;
        const h    = hEnt    ? parseFloat(hEnt.state)    : NaN;

        const bandTxt = (isNaN(low) || isNaN(high))
          ? `Target humidity (${escapeHtml(season)}): —`
          : `Target humidity (${escapeHtml(season)}): ${low.toFixed(0)}–${high.toFixed(0)}%`;

        let comfort = 'Comfort: —';
        if (!isNaN(h) && !isNaN(low) && !isNaN(high)) {
          if (h < low) {
            comfort = 'Comfort: A bit dry — humidify / reduce extraction.';
          } else if (h <= high) {
            comfort = 'Comfort: In the sweet spot — keep steady.';
          } else {
            comfort = 'Comfort: High — ventilate / extract for 10–20 min.';
          }
        }

        const condEnt   = states['sensor.worst_room_condensation'];
        const mouldEnt  = states['sensor.worst_room_mould'];

        const condRoom  = condEnt  ? condEnt.state  : null;
        const condRisk  = states['sensor.worst_room_condensation']?.attributes?.risk;
        const mouldRoom = mouldEnt ? mouldEnt.state : null;
        const mouldRisk = states['sensor.worst_room_mould']?.attributes?.risk;

        let condLine = 'Condensation: —';
        if (condRisk && condRisk !== 'Unknown' && condRoom && condRoom !== 'Unknown') {
          condLine = `Condensation: ${escapeHtml(condRisk)} in ${escapeHtml(condRoom)}`;
        }

        let mouldLine = 'Mould: —';
        if (mouldRisk && mouldRisk !== 'Unknown' && mouldRoom && mouldRoom !== 'Unknown') {
          mouldLine = `Mould: ${escapeHtml(mouldRisk)} in ${escapeHtml(mouldRoom)}`;
        }

        return `${bandTxt}\n${comfort}\n${condLine}\n${mouldLine}`;
      ]]]

    styles:
      card:
        - position: relative
        - border-radius: 22px
        - padding: 12px 14px
        - background: rgba(10,12,16,0.62)
        - border: 2px solid rgba(148,163,184,0.18)
        - box-shadow: 0 0 18px rgba(148,163,184,0.18)
        - overflow: hidden
      grid:
        - grid-template-areas: "\"i n\" \"l l\" \"deltas deltas\""
        - grid-template-columns: 22px 1fr
        - column-gap: 10px
        - row-gap: 6px
        - align-items: center
      icon:
        - width: 18px
        - color: "#94a3b8"
      name:
        - font-size: 15px
        - font-weight: 900
        - letter-spacing: 0.2px
      label:
        - white-space: pre-line
        - font-size: 13px
        - line-height: 1.35
        - opacity: 0.95
        - text-align: left
      custom_fields:
        chevron:
          - position: absolute
          - left: 10px
          - bottom: 8px
          - width: 24px
          - height: 24px
          - display: flex
          - align-items: center
          - justify-content: center
          - border-radius: 999px
          - background: rgba(15,23,42,0.85)
          - box-shadow: 0 0 12px rgba(148,163,184,0.55)
          - color: |
              [[[
                const expanded =
                  states['input_boolean.humidity_constellation_expanded']?.state === 'on';
                return expanded ? '#4ade80' : '#94a3b8';
              ]]]
          - opacity: 0.95
          - pointer-events: none
        deltas:
          - width: 100%
          - justify-self: stretch
          - padding: 4px 2px 2px 2px

