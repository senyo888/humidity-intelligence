# Deprecated V1 Mobile compatibility skin for Humidity Intelligence V2.
#
# Retained through the v2.0.9 line for existing dashboards; use v2_mobile for
# new dashboards. This card renders canonical V2 entities and backend truth with
# the classic four-badge, Comfort Band, and humidity-constellation presentation.
# See the README for migration guidance and frontend dependency requirements
# (button-card, apexcharts-card, mod-card, and card-mod via HACS).

type: vertical-stack
cards:
  ###########################################################################
  # Top row – Humidity, Condensation, Mould, Drift badges
  ###########################################################################
  - type: horizontal-stack
    cards:
      # --- Humidity badge ---------------------------------------------------
      - type: custom:button-card
        entity: sensor.house_average_humidity
        name: Humidity
        icon: mdi:water-percent
        show_name: true
        show_state: true
        show_label: false
        state_display: |
          [[[
            const h = parseFloat(entity.state);
            if (isNaN(h)) return '—%';
            return `${Math.round(h)}%`;
          ]]]
        tap_action:
          action: more-info
        styles:
          card:
            - width: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '122px' : '88px';
                ]]]
            - height: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '122px' : '88px';
                ]]]
            - border-radius: 50%
            - padding: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '10px' : '7px';
                ]]]
            - overflow: hidden
            - background: rgba(10,12,16,0.62)
            - border: |
                [[[
                  const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                  if (state === 'below_target') return '2px solid rgba(56,189,248,0.75)';
                  if (state === 'in_target') return '2px solid rgba(74,222,128,0.70)';
                  if (state === 'above_target') return '2px solid rgba(250,204,21,0.75)';
                  if (state === 'high_risk') return '2px solid rgba(239,68,68,0.85)';
                  return '2px solid rgba(148,163,184,0.22)';
                ]]]
            - box-shadow: |
                [[[
                  const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                  if (state === 'below_target') return '0 0 20px rgba(56,189,248,0.30)';
                  if (state === 'in_target') return '0 0 20px rgba(74,222,128,0.26)';
                  if (state === 'above_target') return '0 0 20px rgba(250,204,21,0.28)';
                  if (state === 'high_risk') return '0 0 22px rgba(239,68,68,0.40)';
                  return '0 0 16px rgba(148,163,184,0.18)';
                ]]]
          grid:
            - grid-template-areas: "\"i\" \"n\" \"s\""
            - grid-template-columns: 1fr
            - grid-template-rows: 34px min-content min-content
            - row-gap: 2px
            - justify-items: center
            - align-items: center
          icon:
            - width: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '32px' : '24px';
                ]]]
            - color: |
                [[[
                  const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                  if (state === 'below_target') return '#38bdf8';
                  if (state === 'in_target') return '#4ade80';
                  if (state === 'above_target') return '#facc15';
                  if (state === 'high_risk') return '#ef4444';
                  return '#94a3b8';
                ]]]
          name:
            - font-size: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '12px' : '10px';
                ]]]
            - font-weight: 900
            - opacity: 0.95
          state:
            - font-size: |
                [[[
                  const w = window.innerWidth || 390;
                  return (w >= 760) ? '18px' : '14px';
                ]]]
            - font-weight: 900
            - letter-spacing: 0.2px
            - color: |
                [[[
                  const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                  if (state === 'below_target') return '#38bdf8';
                  if (state === 'in_target') return '#4ade80';
                  if (state === 'above_target') return '#facc15';
                  if (state === 'high_risk') return '#ef4444';
                  return '#94a3b8';
                ]]]
        card_mod:
          style: |
            ha-card {
              position: relative;
              backdrop-filter: blur(10px);
              -webkit-backdrop-filter: blur(10px);
            }
            ha-card::before {
              content: "";
              position: absolute;
              inset: -45%;
              background: linear-gradient(
                120deg,
                rgba(255,255,255,0.00) 40%,
                rgba(255,255,255,0.10) 48%,
                rgba(255,255,255,0.00) 58%
              );
              transform: translateX(-30%) translateY(-10%) rotate(8deg);
              animation: cvShimmer 8s ease-in-out infinite;
              pointer-events: none;
              opacity: 0.45;
            }
            ha-card::after {
              content: "";
              position: absolute;
              inset: 0;
              border-radius: 50%;
              background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.10), rgba(255,255,255,0.00) 55%);
              pointer-events: none;
              opacity: 0.45;
            }
            @keyframes cvShimmer {
              0%   { transform: translateX(-38%) translateY(-12%) rotate(8deg); opacity: 0.25; }
              50%  { transform: translateX(38%)  translateY(10%)  rotate(8deg); opacity: 0.50; }
              100% { transform: translateX(-38%) translateY(-12%) rotate(8deg); opacity: 0.25; }
            }

