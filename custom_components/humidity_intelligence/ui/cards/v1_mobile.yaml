                  const r = String(entity.state || '').toLowerCase();
                  if (!r || r === 'unknown' || r === 'unavailable') return '0 0 16px rgba(148,163,184,0.18)';
                  if (r.includes('danger') || r.includes('risk')) return '0 0 22px rgba(239,68,68,0.40)';
                  if (r.includes('watch') || r.includes('elev')) return '0 0 20px rgba(250,204,21,0.28)';
                  if (r.includes('low') || r.includes('ok') || r.includes('safe')) return '0 0 20px rgba(74,222,128,0.20)';
                  return '0 0 16px rgba(148,163,184,0.18)';
                ]]]
          grid:
            - grid-template-areas: "\"i\" \"n\" \"s\""
            - grid-template-columns: 1fr
            - grid-template-rows: 34px min-content min-content
            - row-gap: 2px
            - justify-items: center
