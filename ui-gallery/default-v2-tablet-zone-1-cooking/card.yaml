# Humidity Intelligence V2 Tablet Manual-card YAML
#
# What this is:
# - Example Lovelace card YAML for the V2 tablet/wide dashboard.
# - In a live installation, prefer the YAML exported by Humidity Intelligence.
# - Paste the exported YAML into a Home Assistant Dashboard Manual card.
# - Do not paste this into configuration.yaml.
#
# How to use after an upgrade or UI-changing option update:
# 1. Export refreshed Humidity Intelligence card YAML from Home Assistant.
# 2. Open the exact /config/humidity_intelligence/ui/... path from the latest
#    Humidity Intelligence notification; multi-entry/custom exports use other names.
# 3. Replace the old Manual card YAML with the full contents of that file.
# 4. Save the dashboard and hard-refresh the browser/app if the old UI remains cached.
#
# Required custom cards:
# - mod-card
# - card-mod
# - button-card
# - apexcharts-card
#
# The integration replaces placeholder entity IDs when card YAML is exported.
# Edit entity IDs manually only if you are deliberately overriding the generated mapping.

type: custom:mod-card
card_mod:
  style: |
    ha-card {
      --cv-scale: 1; /* try 0.9, 1, 1.1 */

      transform: scale(var(--cv-scale));
      transform-origin: top center;

      background: radial-gradient(1200px 600px at 20% 0%, rgba(56,189,248,0.16), transparent 55%),
                  radial-gradient(1000px 600px at 80% 0%, rgba(250,204,21,0.08), transparent 55%),
                  rgba(15,23,42,0.62);
      border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.22);
      box-shadow: 0 5px 14px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 26px rgba(56,189,248,0.16);
      padding: 11px;
    }
card:
  type: vertical-stack
  cards:
    - type: grid
      columns: 4
      square: false
      cards:
        - type: custom:button-card
          entity: sensor.house_average_humidity
          variables:
            hi_summary: |
              [[[ return {"title": "Humidity", "history": "sensor.house_average_humidity", "description": "The current house average relative humidity. HI’s seasonal target band provides context for this reading.", "historyNote": "Recorded house-average humidity.", "kind": "humidity"}; ]]]
          triggers_update:
            - sensor.house_average_humidity
          name: Humidity
          icon: mdi:water-percent
          show_name: true
          show_state: true
          show_label: false
          state_display: |
            [[[
              const raw = typeof entity?.state === 'string' ? entity.state.trim() : '';
              const numeric = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(raw) && Number.isFinite(Number(raw));
              if (!numeric) return '—%';
              return `${Math.round(Number(raw))}%`;
            ]]]
          custom_fields:
            summary_open: |
              [[[
                const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
                const raw = typeof entity?.state === 'string' ? entity.state.trim() : '';
                const numeric = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(raw) && Number.isFinite(Number(raw));
                const current = variables.hi_summary.kind === 'humidity' ? (numeric ? raw + '%' : 'Unavailable') : (raw || 'Unavailable');
                return `<button type="button" class="hi-summary-open" aria-label="${escapeHtml(variables.hi_summary.title)}: ${escapeHtml(current)}. Open details"></button>`;
              ]]]
            summary: |
              [[[
                const view = variables.hi_summary;
                const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
                const readable = value => typeof value === 'string' && value.trim() ? value.trim() : 'Unavailable';
                const current = readable(entity?.state);
                const humidityText = typeof entity?.state === 'string' ? entity.state.trim() : '';
                const humidityValid = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(humidityText) && Number.isFinite(Number(humidityText));
                const target = states[view.history];
                const historyName = readable(target?.attributes?.friendly_name);
                const reason = states['sensor.air_control_reason'];
                const context = view.kind === 'risk'
                  ? `Source: ${current}. Risk: ${readable(entity?.attributes?.risk)}.`
                  : view.kind === 'mode'
                    ? `Current mode: ${current}. Reason: ${readable(reason?.attributes?.full_reason || reason?.state)}.`
                    : `Current humidity: ${humidityValid ? humidityText + '%' : 'Unavailable'}.`;
                return `<template class="hi-summary-template">
                  <style>dialog.hi-summary-details { box-sizing:border-box; width:min(520px,calc(100vw - 32px)); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px); overflow:auto; padding:20px; border:1px solid #354762; border-radius:20px; background:#0d1522; color:#e2e8f0; text-align:left; white-space:normal; font:14px/1.6 system-ui,sans-serif; }
                  dialog.hi-summary-details::backdrop { background:rgba(0,0,0,.55); }
                  dialog.hi-summary-details h2 { margin:0 0 16px; font-size:20px; }
                  dialog.hi-summary-details p { overflow-wrap:anywhere; }
                  dialog.hi-summary-details button { min-height:44px; padding:10px 16px; border:1px solid #64748b; border-radius:10px; background:#1e293b; color:#f1f5f9; font:inherit; cursor:pointer; }
                  dialog.hi-summary-details .hi-summary-close { display:grid; place-items:center; position:sticky; top:0; margin:0 0 12px auto; z-index:1; box-sizing:border-box; width:44px; height:44px; min-width:44px; min-height:44px; padding:0; border:0; border-radius:50%; background:transparent; color:#e2e8f0; cursor:pointer; } dialog.hi-summary-details .hi-summary-close::before { content:""; position:absolute; inset:6px; border:1px solid #64748b; border-radius:50%; background:#18253a; } dialog.hi-summary-details .hi-summary-close svg { position:relative; pointer-events:none; }
                  dialog.hi-summary-details button:focus-visible { outline:2px solid #38bdf8; outline-offset:2px; }</style>
                  <button type="button" class="hi-summary-close" aria-label="Close" title="Close" autofocus><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
                  <h2>${escapeHtml(view.title)}</h2>
                  <p>${escapeHtml(view.description)}</p>
                  <p>${escapeHtml(context)}</p>
                  <p>${target ? `History: ${escapeHtml(historyName === 'Unavailable' ? 'mapped entity' : historyName)}. ${escapeHtml(view.historyNote)}` : 'This source is currently unavailable in Home Assistant.'}</p>
                  <p>Available history depends on Home Assistant Recorder and retention.</p>
                  <button type="button" class="hi-summary-history" ${target ? '' : 'disabled'}>View history</button>
                </template>`;
              ]]]
          tap_action:
            action: javascript
            javascript: |
              [[[
                // HI-INACTIVITY:START
                /* Self-contained inactivity custody for HI-owned details; no runtime writes. */
                function hiDialogInactivity(dialog, owner, close, connection) {
                  const idleMs = 120000;
                  const activity = ['pointerdown', 'touchstart', 'touchmove', 'keydown', 'input', 'wheel', 'scroll'];
                  const navigation = ['location-changed', 'popstate', 'pagehide'];
                  let timer, generation = 0, disposed = false, lastIntent = -Infinity;
                  const observer = new MutationObserver(() => {
                    if (!owner.isConnected || !dialog.isConnected) finish();
                  });
                  function dispose() {
                    if (disposed) return;
                    disposed = true; generation++; clearTimeout(timer);
                    observer.disconnect();
                    for (const name of activity) dialog.removeEventListener(name, interact, true);
                    for (const name of navigation) window.removeEventListener(name, finish);
                    connection?.removeEventListener?.('disconnected', finish);
                    dialog.removeEventListener('close', dispose);
                  }
                  function finish() {
                    if (disposed) return;
                    dispose(); close();
                  }
                  function arm() {
                    if (disposed) return;
                    clearTimeout(timer); const current = ++generation;
                    timer = setTimeout(() => {
                      if (!disposed && current === generation) finish();
                    }, idleMs);
                  }
                  function interact(event) {
                    // Programmatic clicks/keyboard dispatch and telemetry never extend custody.
                    if (event.isTrusted !== true) return;
                    // Browser-generated scroll can follow programmatic focus/telemetry changes.
                    // Only count it in the wake of actual input within this panel.
                    if (event.type === 'scroll') {
                      if (Date.now() - lastIntent <= 1000) arm();
                    } else {
                      lastIntent = Date.now(); arm();
                    }
                  }
                  for (const name of activity) dialog.addEventListener(name, interact, {capture:true, passive:name !== 'keydown'});
                  for (const name of navigation) window.addEventListener(name, finish);
                  connection?.addEventListener?.('disconnected', finish);
                  dialog.addEventListener('close', dispose);
                  let root = owner.getRootNode();
                  while (root) {
                    observer.observe(root, {childList:true, subtree:true});
                    root = root.host ? root.host.getRootNode() : null;
                  }
                  arm();
                  if (connection?.connected === false) finish();
                  return dispose;
                }
                // HI-INACTIVITY:END
                const owner = this;
                const entityId = variables.hi_summary.history;
                const history = () => {
                  if (entityId && states[entityId] && owner.isConnected) owner.dispatchEvent(new CustomEvent('hass-more-info', {
                    detail: { entityId }, bubbles: true, composed: true
                  }));
                };
                const source = owner.shadowRoot?.querySelector('template.hi-summary-template');
                window.__hiBadgeDetailsDispose?.(false);
                if (!source || !owner.isConnected) { history(); return; }
                const dialog = document.createElement('dialog');
                if (typeof dialog.showModal !== 'function') { history(); return; }
                const snapshot = source.innerHTML;
                dialog.className = 'hi-summary-details';
                dialog.setAttribute('data-hi-summary-dialog', '');
                dialog.setAttribute('aria-label', `${variables.hi_summary.title} details`);
                dialog.innerHTML = snapshot;
                const previousFocus = owner.shadowRoot?.activeElement || document.activeElement;
                let observer;
                let idleDispose;
                let cleaned = false;
                let restoreFocus = true;
                const cleanup = () => {
                  if (cleaned) return;
                  cleaned = true;
                  idleDispose?.();
                  observer?.disconnect();
                  for (const name of ['location-changed', 'popstate', 'pagehide']) window.removeEventListener(name, close);
                  if (window.__hiBadgeDetailsDispose === dispose) delete window.__hiBadgeDetailsDispose;
                  dialog.remove();
                  if (restoreFocus && owner.isConnected && previousFocus?.isConnected) previousFocus.focus();
                };
                const close = () => { if (dialog.open) dialog.close(); cleanup(); };
                const dispose = (restore = true) => { restoreFocus = restore; close(); };
                window.__hiBadgeDetailsDispose = dispose;
                dialog.addEventListener('close', cleanup, { once: true });
                dialog.querySelector('.hi-summary-close').addEventListener('click', close);
                const historyButton = dialog.querySelector('.hi-summary-history');
                historyButton.disabled = !entityId || !states[entityId];
                historyButton.addEventListener('click', () => { close(); history(); });
                dialog.addEventListener('click', event => {
                  event.stopPropagation();
                  if (event.target !== dialog) return;
                  const bounds = dialog.getBoundingClientRect();
                  if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) close();
                });
                for (const name of ['location-changed', 'popstate', 'pagehide']) window.addEventListener(name, close);
                observer = new MutationObserver(() => {
                  const current = owner.shadowRoot?.querySelector('template.hi-summary-template');
                  if (!owner.isConnected || !current || current.innerHTML !== snapshot) close();
                });
                let root = owner.shadowRoot;
                while (root) {
                  observer.observe(root, { childList: true, subtree: true, characterData: true });
                  root = root.host ? root.host.getRootNode() : null;
                }
                document.body.appendChild(dialog);
                try { dialog.showModal(); idleDispose = hiDialogInactivity(dialog, owner, close, hass?.connection); }
                catch (_) { cleanup(); history(); }
              ]]]
          extra_styles: |
            .hi-summary-open { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; border-radius:inherit; background:transparent; pointer-events:none; }
            .hi-summary-open:focus-visible { outline:2px solid #38bdf8; outline-offset:-4px; }
          styles:
            custom_fields:
              summary_open:
                - position: absolute
                - inset: 0
                - border-radius: inherit
                - pointer-events: none
                - z-index: 2
              summary:
                - display: none
            card:
              - height: 118px
              - border-radius: 22px
              - padding: 10px
              - background: rgba(10,12,16,0.62)
              - border: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '2px solid rgba(56,189,248,0.75)';
                    if (state === 'in_target') return '2px solid rgba(74,222,128,0.70)';
                    if (state === 'above_target') return '2px solid rgba(250,204,21,0.75)';
                    if (state === 'high_risk') return '2px solid rgba(239,68,68,0.85)';
                    return '2px solid rgba(148,163,184,0.22)';
                  ]]]
              - box-shadow: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '0 3px 8px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 24px rgba(56,189,248,0.20)';
                    if (state === 'in_target') return '0 3px 8px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 24px rgba(74,222,128,0.20)';
                    if (state === 'above_target') return '0 3px 8px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 24px rgba(250,204,21,0.22)';
                    if (state === 'high_risk') return '0 3px 8px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 24px rgba(239,68,68,0.22)';
                    return '0 3px 8px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 16px rgba(148,163,184,0.18)';
                  ]]]
              - backdrop-filter: blur(12px)
              - "-webkit-backdrop-filter": blur(12px)
            grid:
              - grid-template-areas: "\"i\" \"n\" \"s\""
              - grid-template-rows: 42px min-content min-content
              - justify-items: center
              - align-items: center
              - row-gap: 4px
            icon:
              - width: 32px
              - color: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '#38bdf8';
                    if (state === 'in_target') return '#4ade80';
                    if (state === 'above_target') return '#facc15';
                    if (state === 'high_risk') return '#ef4444';
                    return '#94a3b8';
                  ]]]
            name:
              - font-size: 12px
              - font-weight: 900
              - opacity: 0.95
            state:
              - font-size: 20px
              - font-weight: 900
              - letter-spacing: 0.2px
              - color: |
                  [[[
                    const state = String(states['sensor.house_humidity_state']?.state || '').toLowerCase();
                    if (state === 'below_target') return '#38bdf8';
                    if (state === 'in_target') return '#4ade80';
                    if (state === 'above_target') return '#facc15';
                    if (state === 'high_risk') return '#ef4444';
                    return '#94a3b8';
                  ]]]
        - type: custom:button-card
          entity: sensor.worst_room_condensation
          variables:
            hi_summary: |
              [[[ return {"title": "Condensation", "history": "sensor.worst_room_condensation", "description": "Shows the highest condensation risk across rooms with available readings.", "historyNote": "Recorded risk and reported source room, on separate aligned timelines.", "kind": "risk", "historyEntities": [{"id": "sensor.worst_room_condensation_risk", "label": "Highest reported risk", "kind": "risk"}, {"id": "sensor.worst_room_condensation", "label": "Reported source room", "kind": "source"}]}; ]]]
          triggers_update:
            - sensor.worst_room_condensation
            - sensor.worst_room_condensation_risk
          name: Condensation
          icon: mdi:water-alert
          show_name: true
          show_state: true
          show_label: false
          state_display: |
            [[[
              const r = states['sensor.worst_room_condensation']?.attributes?.risk;
              if (!r || r === 'unknown' || r === 'unavailable') return '—';
              return String(r);
            ]]]
          custom_fields:
            summary_open: |
              [[[
                const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
                const raw = typeof entity?.state === 'string' ? entity.state.trim() : '';
                const numeric = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(raw) && Number.isFinite(Number(raw));
                const current = variables.hi_summary.kind === 'humidity' ? (numeric ? raw + '%' : 'Unavailable') : (raw || 'Unavailable');
                return `<button type="button" class="hi-summary-open" aria-label="${escapeHtml(variables.hi_summary.title)}: ${escapeHtml(current)}. Open details"></button>`;
              ]]]
            summary: |
              [[[
                const view = variables.hi_summary;
                const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
                const readable = value => typeof value === 'string' && value.trim() ? value.trim() : 'Unavailable';
                const current = readable(entity?.state);
                const humidityText = typeof entity?.state === 'string' ? entity.state.trim() : '';
                const humidityValid = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(humidityText) && Number.isFinite(Number(humidityText));
                const target = states[view.history];
                const historyAvailable = view.historyEntities.some(item => states[item.id]);
                const historyName = readable(target?.attributes?.friendly_name);
                const reason = states['sensor.air_control_reason'];
                const context = view.kind === 'risk'
                  ? `Source: ${current}. Risk: ${readable(entity?.attributes?.risk)}.`
                  : view.kind === 'mode'
                    ? `Current mode: ${current}. Reason: ${readable(reason?.attributes?.full_reason || reason?.state)}.`
                    : `Current humidity: ${humidityValid ? humidityText + '%' : 'Unavailable'}.`;
                return `<template class="hi-summary-template">
                  <style>dialog.hi-summary-details { box-sizing:border-box; width:min(520px,calc(100vw - 32px)); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px); overflow:auto; padding:20px; border:1px solid #354762; border-radius:20px; background:#0d1522; color:#e2e8f0; text-align:left; white-space:normal; font:14px/1.6 system-ui,sans-serif; }
                  dialog.hi-summary-details::backdrop { background:rgba(0,0,0,.55); }
                  dialog.hi-summary-details h2 { margin:0 0 16px; font-size:20px; }
                  dialog.hi-summary-details p { overflow-wrap:anywhere; }
                  dialog.hi-summary-details button { min-height:44px; padding:10px 16px; border:1px solid #64748b; border-radius:10px; background:#1e293b; color:#f1f5f9; font:inherit; cursor:pointer; }
                  dialog.hi-summary-details .hi-summary-close { display:grid; place-items:center; position:sticky; top:0; margin:0 0 12px auto; z-index:1; box-sizing:border-box; width:44px; height:44px; min-width:44px; min-height:44px; padding:0; border:0; border-radius:50%; background:transparent; color:#e2e8f0; cursor:pointer; } dialog.hi-summary-details .hi-summary-close::before { content:""; position:absolute; inset:6px; border:1px solid #64748b; border-radius:50%; background:#18253a; } dialog.hi-summary-details .hi-summary-close svg { position:relative; pointer-events:none; }
                  dialog.hi-summary-details button:focus-visible { outline:2px solid #38bdf8; outline-offset:2px; }</style>
                  <button type="button" class="hi-summary-close" aria-label="Close" title="Close" autofocus><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
                  <h2>${escapeHtml(view.title)}</h2>
                  <p>${escapeHtml(view.description)}</p>
                  <p>${escapeHtml(context)}</p>
                  <p>${historyAvailable ? escapeHtml(view.historyNote) : 'History sources are currently unavailable in Home Assistant.'}</p>
                  <p>Available history depends on Home Assistant Recorder and retention.</p>
                  <button type="button" class="hi-summary-history" ${historyAvailable ? '' : 'disabled'}>View history</button>
                </template>`;
              ]]]
          tap_action:
            action: javascript
            javascript: |
              [[[
                // HI-HISTORY-RENDERER:START
                /* HI badge history: canonical source, embedded by scripts/sync_badge_history.py.
                 * No network or DOM work occurs until create().open() is called by View history.
                 * Historical records are observations, never control decisions or health scores.
                 */
                const hiBadgeHistory = (() => {
                  const MAX_RESPONSE_RECORDS = 10000;
                  const MAX_DISPLAY_RECORDS = 500;
                  const NUMBER = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;
                  const escape = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
                  const text = value => typeof value === 'string' ? (value.length > 2000 ? value.slice(0, 2000) + '… [text shortened]' : value) : '';
                  const numeric = value => typeof value === 'string' && NUMBER.test(value.trim()) && Number.isFinite(Number(value.trim())) ? Number(value.trim()) : null;
                  const timestamp = value => typeof value === 'number' && Number.isFinite(value) ? Math.round(value * 1000) : typeof value === 'string' ? Date.parse(value) : NaN;
                  function normalize(raw, start, end, kind) {
                    if (!Array.isArray(raw)) return {records: [], status: 'missing', omitted: 0};
                    if (raw.length > MAX_RESPONSE_RECORDS) return {records: [], status: 'oversize', omitted: raw.length};
                    let invalid = 0;
                    const rows = [];
                    for (const item of raw) {
                      if (!item || typeof item !== 'object') { invalid++; continue; }
                      // lu/last_updated is the recorded observation time, including attribute updates.
                      const time = timestamp(item.lu ?? item.last_updated ?? item.lc ?? item.last_changed);
                      if (!Number.isFinite(time) || time > end || time < start) { invalid++; continue; }
                      const attrs = item.a && typeof item.a === 'object' ? item.a : item.attributes && typeof item.attributes === 'object' ? item.attributes : {};
                      const state = text(item.s ?? item.state);
                      const value = kind === 'reason' ? text(attrs.full_reason) || state : state;
                      const unit = typeof attrs.unit_of_measurement === 'string' && attrs.unit_of_measurement.trim() ? text(attrs.unit_of_measurement.trim()) : null;
                      rows.push({time, state: value || 'Unknown', unit, number: numeric(value), boundary: time === start, conflict: false});
                    }
                    rows.sort((a, b) => a.time - b.time);
                    const unique = [];
                    for (const row of rows) {
                      const previous = unique[unique.length - 1];
                      if (previous?.time === row.time) {
                        if (previous.state !== row.state || previous.unit !== row.unit) {
                          previous.state = 'Conflicting records'; previous.number = null; previous.unit = null; previous.conflict = true;
                        }
                      } else unique.push(row);
                    }
                    const omitted = Math.max(0, unique.length - MAX_DISPLAY_RECORDS);
                    unique.forEach((record, index) => {record.transition = index > 0 && (record.state !== unique[index - 1].state || record.conflict);});
                    return {records: unique.slice(omitted), status: unique.length ? 'ok' : 'empty', omitted, invalid};
                  }
                  function category(value, kind) {
                    if (kind === 'source' || kind === 'reason') return {label: value, tone: 'neutral'};
                    if (['unknown', 'unavailable', 'Conflicting records'].some(x => x.toLowerCase() === value.toLowerCase())) return {label: value, tone: 'unknown'};
                    if (kind === 'risk') {
                      const risk = {OK: 'ok', Watch: 'watch', Risk: 'risk', Danger: 'danger', Unknown: 'unknown'};
                      return Object.hasOwn(risk, value) ? {label: value, tone: risk[value]} : {label: `Unrecognised recorded value: ${value}`, tone: 'unknown'};
