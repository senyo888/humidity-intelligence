              0%, 100% { box-shadow: 0 0 9px 3px var(--hi-stability-color); }
              50% { box-shadow: 0 0 9px 3px var(--hi-stability-score-color); }
            }
            .hi-stability-center {
              position: relative;
              z-index: 1;
              display: grid;
              place-items: center;
              line-height: 1;
              font-variant-numeric: tabular-nums;
            }
            .hi-stability-center span {
              color: #f8fafc;
              font-size: 26px;
              font-weight: 750;
              letter-spacing: -0.045em;
              text-shadow: 0 1px 3px rgba(0,0,0,0.45);
            }
            .hi-stability-center[data-digits="3"] span {
              font-size: 23px;
            }
            .hi-stability-failure-history {
              position: absolute;
              z-index: 2;
              inset: 3px;
              border-radius: inherit;
              pointer-events: none;
              opacity: 0.8;
              -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 calc(100% - 0.75px), #000 calc(100% - 0.25px), transparent 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 calc(100% - 0.75px), #000 calc(100% - 0.25px), transparent 100%);
            }
            .hi-stability-failure-mark {
              position: absolute;
              inset: 0;
              border-radius: inherit;
              background: conic-gradient(from var(--hi-failure-angle), #ef4444 0deg 0.5deg, transparent 0.5deg 360deg);
            }
            .hi-stability-direction,
            .hi-stability-evidence {
              position: absolute;
              z-index: 2;
              border-radius: 999px;
              inset: 0;
            }
            .hi-stability-direction {
              opacity: 0;
              -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.25px), #000 calc(100% - 1px), #000 calc(100% - 0.25px), transparent 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 1.25px), #000 calc(100% - 1px), #000 calc(100% - 0.25px), transparent 100%);
              filter: drop-shadow(0 0 1px var(--hi-stability-led-color));
            }
            .hi-stability-mark {
              position: absolute;
              inset: 0;
              border-radius: inherit;
              background: conic-gradient(from var(--hi-mark-angle), var(--hi-stability-led-color) 0deg var(--hi-mark-width, 0.8deg), transparent var(--hi-mark-width, 0.8deg) 360deg);
              opacity: var(--hi-mark-to);
              animation: hi-stability-mark-on 138ms ease-out var(--hi-mark-delay) both;
            }
            @keyframes hi-stability-mark-on {
              from { opacity: var(--hi-mark-from); }
              to { opacity: var(--hi-mark-to); }
            }
            .hi-stability-direction-higher,
            .hi-stability-direction-lower {
              opacity: 1;
            }
            .hi-stability-direction-lower {
              transform: scaleX(-1);
            }
            .hi-stability-evidence {
              display: none;
            }
            .hi-stability-evidence.active {
              display: block;
              background: repeating-conic-gradient(from 0deg, var(--hi-stability-color) 0deg 5deg, transparent 5deg 14deg);
              -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px), #000 calc(100% - 1px), transparent 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px), #000 calc(100% - 1px), transparent 100%);
              filter: drop-shadow(0 0 3px var(--hi-stability-color));
            }
            .hi-stability-origin {
              position: absolute;
              z-index: 3;
              left: 40.25px;
              top: 0;
              width: 1.5px;
              height: 1.5px;
              border-radius: 999px;
              background: var(--hi-stability-color);
              box-shadow: 0 0 2px var(--hi-stability-color);
            }
            .hi-stability-gauge-white .hi-stability-direction-higher,
            .hi-stability-gauge-white .hi-stability-direction-lower,
            .hi-stability-gauge-white .hi-stability-origin {
              animation: hi-stability-led-shimmer 6000ms ease-in-out infinite;
            }
            @keyframes hi-stability-white-shimmer {
              0%, 100% { opacity: 0.34; filter: brightness(0.92); }
              50% { opacity: 0.64; filter: brightness(1.25); }
            }
            @keyframes hi-stability-led-shimmer {
              0%, 100% { opacity: 0.65; }
              50% { opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
              .hi-stability-gauge-partial-pulse::before {
                box-shadow: 0 0 9px 3px var(--hi-stability-score-color);
              }
              .hi-stability-partial-label::before {
                content: "";
                display: inline-block;
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: #ec4899;
                margin-right: 4px;
                vertical-align: middle;
              }
              .hi-stability-mark {
                animation: none !important;
                opacity: var(--hi-mark-to);
              }
              .hi-stability-gauge-partial-pulse::before,
              .hi-stability-gauge-white::before,
              .hi-stability-gauge-white .hi-stability-direction-higher,
              .hi-stability-gauge-white .hi-stability-direction-lower,
              .hi-stability-gauge-white .hi-stability-origin {
                animation: none !important;
              }
            }
