      hold_action:
        action: more-info
      extra_styles: |
        .hi-summary-open { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; border-radius:inherit; background:transparent; pointer-events:none; }
        .hi-summary-open:focus-visible { outline:2px solid #38bdf8; outline-offset:-4px; }
      styles:
        card:
          - position: relative
          - padding: 16px 16px 14px 16px
          - border-radius: 22px
          - background: rgba(2,6,23,0.38)
          - border: |
              [[[
                const mode = String(states['sensor.air_control_mode']?.state || '').trim().toLowerCase();
                const borderKnownModes = new Set([
                  'normal',
                  'co_emergency',
                  'danger',
                  'air_quality',
                  'global_gate',
                  'away',
                  'cooking',
                  'bathroom',
                  'bath',
                  'paused',
                  'manual_override',
                  'disabled',
                  'telemetry_unavailable',
                ]);
                const borderModeKnown =
                  !!mode &&
                  mode !== 'unknown' &&
                  mode !== 'unavailable' &&
                  (borderKnownModes.has(mode) || mode.includes('alert'));
                const anyAlertActive = Object.keys(states).some((id) => {
                  const stateObj = states[id];
                  if (stateObj?.state !== 'on') return false;
                  const attrs = stateObj.attributes || {};
                  if (attrs.alert_index !== undefined && attrs.trigger_type) return true;
                  return /^(?:switch|input_boolean)\\.(?:hi_)?(?:air_)?alert_\\d+.*_active(?:_\\d+)?$/.test(id);
                });
                const zone1 = mode === 'cooking';
                const zone2 = mode === 'bathroom' || mode === 'bath';
                const gateActive = mode === 'global_gate' || mode === 'away';
                const coE = states['input_boolean.air_co_emergency_active']?.state === 'on';
                const red =
                  mode.includes('alert') ||
                  mode === 'co_emergency' ||
                  coE ||
                  (!gateActive && anyAlertActive);
                if (mode === 'telemetry_unavailable') return '1px solid rgba(245,158,11,0.78)';
                if (!borderModeKnown) return '1px solid rgba(148,163,184,0.55)';
                if (red) return '1px solid rgba(239,68,68,0.85)';
                if (gateActive) return '1px solid rgba(245,158,11,0.78)';
                if (zone1) return '1px solid rgba(56,189,248,0.75)';
                if (zone2) return '1px solid rgba(74,222,128,0.70)';

                const aqActive =
                  mode === 'air_quality' ||
                  states['input_boolean.air_aq_upstairs_active']?.state === 'on' ||
                  states['input_boolean.air_aq_downstairs_active']?.state === 'on';

                if (aqActive) return '1px solid rgba(168,85,247,0.70)';
                if (mode === 'normal') return '1px solid rgba(229,231,235,0.68)';
                if (mode === 'paused') return '1px solid rgba(250,204,21,0.70)';
                return '1px solid rgba(148,163,184,0.55)';
              ]]]
          - box-shadow: 0 0 22px rgba(148,163,184,0.16)
          - backdrop-filter: blur(14px)
          - "-webkit-backdrop-filter": blur(14px)
          - overflow: hidden
        grid:
          - grid-template-areas: |
              [[[
                const showTemp = !!states['sensor.hi_diagnostics']?.attributes?.config?.slope?.show_temperature_chips;
                const rows = [
                  '"i i"',
                  '"n n"',
                  '"s s"',
                  '"l l"',
                  '"status status"',
                  '"reason reason"',
                  '"aq aq"',
                  '"humidity humidity"',
                ];
                if (showTemp) rows.push('"temperature temperature"');
                return rows.join('\n');
              ]]]
          - grid-template-columns: 1fr 1fr
          - row-gap: 6px
          - justify-items: center
          - align-items: center
        icon:
          - width: 40px
          - height: 36px
          - color: rgba(226,232,240,0.92)
        name:
          - font-size: 22px
          - font-weight: 900
          - color: rgba(226,232,240,0.96)
          - text-align: center
        state:
          - font-size: 14px
          - font-weight: 900
          - letter-spacing: 1px
          - color: rgba(226,232,240,0.68)
          - text-align: center
        label:
          - margin-top: 2px
          - font-size: 15px
          - line-height: 1.35
          - white-space: pre-line
          - color: rgba(226,232,240,0.72)
          - text-align: center
        custom_fields:
          summary_open:
            - position: absolute
            - inset: 0
            - border-radius: inherit
            - pointer-events: none
            - z-index: 2
          summary:
            - display: none
          status:
            - width: 100%
            - justify-self: stretch
          reason:
            - width: 100%
            - justify-self: stretch
          aq:
            - width: 100%
            - justify-self: stretch
          humidity:
            - width: 100%
            - justify-self: stretch
          temperature:
            - width: 100%
            - justify-self: stretch
            - display: |
                [[[
                  return states['sensor.hi_diagnostics']?.attributes?.config?.slope?.show_temperature_chips
                    ? 'block'
                    : 'none';
                ]]]
      card_mod:
